# SPDX-License-Identifier: Apache-2.0
# Codecov configuration — https://docs.codecov.io/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Blocking. `informational: true` sat here through the cold start,
        # with a flip condition — "once `main` has a post-merge `integration`
        # upload, i.e. a real combined baseline exists to carry forward". That
        # condition is met, and this is what was checked rather than reasoned
        # about, on 2026-09-08:
        #
        #   - The `integration` job runs and succeeds on every recent push to
        #     `main` (runs 34203535367, 34197578478, 34160220667, 34158633812).
        #   - Its upload is real, not a silent no-op under
        #     `fail_ci_if_error: false` — which is the failure this repo has
        #     already had once, on a `report.lcov` path that never existed. The
        #     job log for run 34203535367 (commit dd58ca62) ends:
        #       `./codecov upload-coverage … --file coverage/lcov.info --flag integration`
        #       `Found 1 coverage files to report`
        #       `Sending upload (497686 bytes) to storage`
        #       `Upload queued for processing complete`
        #   - Codecov agrees it has the flag:
        #     `GET /api/v2/github/appstrate/repos/appstrate/flags/` →
        #     `{"flag_name":"integration","coverage":76.11585}`, alongside
        #     `unit` 54.44, `public-origin` 54.44 and `cli` 56.35.
        #
        # The 75% target is UNCHANGED and was re-derived against the combined
        # number rather than assumed: `main` at dd58ca62 reports 75.47%
        # (101 471 / 134 447 lines, 4 sessions), and the five preceding
        # `main` commits sit at 76.09–76.21%. So the target has ~0.5–1.2 points
        # of live headroom on top of the 2% threshold below.
        #
        # What the removed line ALSO covered, and where that now stands: fork
        # PRs cannot read CODECOV_TOKEN, so a failed tokenless upload would
        # leave them with a project status they cannot clear. That is now an
        # advisory red rather than a block — checked 2026-09-08, the `Protect
        # main` ruleset carries only `pull_request` and `non_fast_forward`, and
        # `required_status_checks` is absent, so no Codecov status gates a
        # merge. If required checks are ever added, exclude this one for forks
        # before adding it.
        target: 75%
        threshold: 2%
    # NOTE: PRs that add code exercised only by the integration suite
    # (orchestrator, run-state, credential paths) should carry the
    # `integration` label so this `patch` gate and the `component_management`
    # statuses below reflect real integration runs. carryforward preserves base
    # coverage but cannot cover NEW lines, so unit-only runs understate them.
    patch:
      default:
        target: 50%

# Coverage arrives under three flags from two CI jobs (see test.yml):
#   - `unit`          → runs on every push + PR (pure unit suites)
#   - `public-origin` → fast proxy-boundary integration regression, always run
#   - `integration`   → runs on push to main + PRs labelled `integration`
# carryforward keeps a flag's last-known coverage when its job did not run for a
# given commit. On a normal PR only the always-on job runs (publishing `unit`
# and `public-origin`), so `integration` is carried forward from the PR base —
# without it the project total would falsely collapse on every PR.
flags:
  unit:
    carryforward: true
  public-origin:
    carryforward: false
  integration:
    carryforward: true

# Per-path floors for the highest-risk subsystems. `target: auto` enforces a
# no-regression floor against the PR base (the current measured level is the
# floor) — chosen over absolute numbers because the full combined coverage of
# these paths is only produced by the integration suite, which is not run
# locally here, so a hand-picked absolute target would be a guess. Once a stable
# Codecov baseline exists these SHOULD be ratcheted to explicit absolute targets,
# strictest first (orchestrator). Hot paths use a tighter 1% threshold than the
# global 2% gate.
component_management:
  individual_components:
    - component_id: orchestrator
      name: orchestrator
      paths:
        - apps/api/src/services/orchestrator/**
      statuses:
        - type: project
          target: auto
          threshold: 1%
    - component_id: rbac
      name: rbac
      paths:
        - apps/api/src/lib/auth-cookies.ts
        - apps/api/src/lib/auth-pipeline.ts
        - apps/api/src/lib/auth-secrets.ts
        - apps/api/src/middleware/require-permission.ts
      statuses:
        - type: project
          target: auto
          threshold: 1%
    - component_id: credentials
      name: credentials
      paths:
        - packages/connect/src/**
        - apps/api/src/services/connect/**
      statuses:
        - type: project
          target: auto
          threshold: 1%
    - component_id: run-state
      name: run-state
      paths:
        - apps/api/src/services/state/**
      statuses:
        - type: project
          target: auto
          threshold: 1%

ignore:
  - "apps/web/**"
  # `**/test/**` (not `test/**`) to also drop NESTED test harnesses
  # (apps/api/test/**, packages/*/test/**, apps/api/src/modules/*/test/**, …).
  # The `**/` matches the `test` path segment, not the substring, so product
  # dirs such as apps/api/src/latest/** stay covered. Lockstep with
  # bunfig.toml coveragePathIgnorePatterns.
  - "**/test/**"
  - "scripts/**"
  - "packages/db/src/schema/**"
  - "packages/shared-types/**"

comment:
  layout: "condensed_header, condensed_files, components, condensed_footer"
  require_changes: true
