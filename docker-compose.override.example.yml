# Appstrate — Development Override
#
# Copy this file to docker-compose.override.yml (gitignored).
# Compose auto-merges it with docker-compose.yml.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d        # starts postgres + redis + minio + builds runtime images
#   bun run dev                  # start API + frontend on :3000 (migrates at boot)
#
# This file is what puts the `appstrate` service behind the `prod` profile, which
# is why `bun run docker:prod` passes `--profile prod`. Without this override,
# `docker-compose.yml` declares no profiles and `docker compose up -d` starts the
# full stack (the self-hosting path).

services:
  # ── Build runtime images locally ────────────────────────────────
  # Both Dockerfiles are written to build FROM THE REPO ROOT: they `COPY` the
  # root `package.json` + `bun.lock` so the `@appstrate/*` workspace graph
  # resolves the same way it does for a local `bun install`. There is no
  # `runtime-pi/bun.lock`, so `context: ./runtime-pi` cannot build — the context
  # must be `.` with an explicit `dockerfile:`. This mirrors what CI does
  # (.github/workflows/release.yml + preview.yml) and `bun run docker:build:*`.
  appstrate-pi:
    build:
      context: .
      dockerfile: ./runtime-pi/Dockerfile
    image: appstrate-pi:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "echo 'runtime image built'"]

  appstrate-sidecar:
    build:
      context: .
      dockerfile: ./runtime-pi/sidecar/Dockerfile
    image: appstrate-sidecar:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "echo 'sidecar image built'"]

  # ── MinIO for local S3-compatible storage ─────────────────────
  appstrate-minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: server /data
    networks:
      - appstrate-data
      - default
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Admin web console disabled — inspect buckets via `docker compose exec appstrate-minio mc ...`
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the default bucket on first start
  appstrate-minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      appstrate-minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://appstrate-minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/appstrate &&
      echo 'Bucket appstrate ready'
      "

  # ── Expose database ports to host for local development ────────
  # appstrate-data is internal: true, so ports require a non-internal network.
  appstrate-postgres:
    networks:
      - appstrate-data
      - default
    ports:
      - "5432:5432"

  appstrate-redis:
    networks:
      - appstrate-data
      - default
    ports:
      - "6379:6379"

  # ── Disable services handled manually in dev ────────────────────
  # There is deliberately NO `appstrate-migrate` override here: `docker-compose.yml`
  # declares no such service, and the platform applies migrations itself at boot
  # (`apps/api/src/lib/boot.ts`). An override-only entry would have created a
  # second, misnamed copy of the platform container.
  #
  # Platform: run it with `bun run dev` instead. The `prod` profile keeps the
  # containerized platform out of `docker compose up -d` so it doesn't fight the
  # dev server for :3000; `bun run docker:prod` opts back in.
  appstrate:
    profiles: [prod]
    build:
      context: .

volumes:
  miniodata:
