<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Navbar</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        width: 100%;
        height: 44px;
        padding-left: 76px;
        border-bottom: 1px solid #e0e0e0;
      }
      .browser-controls {
        display: none;
        align-items: center;
        box-sizing: border-box;
        flex: 0 0 auto;
        height: 100%;
        padding: 0 8px;
        gap: 4px;
        border-left: 1px solid #e0e0e0;
      }
      .bar[data-mode="split"] .browser-controls,
      .bar[data-mode="browser"] .browser-controls {
        display: flex;
      }
      .closed-controls {
        display: flex;
        align-items: center;
        height: 100%;
        padding-right: 8px;
      }
      .bar:not([data-mode="webapp"]) .closed-controls {
        display: none;
      }
      .nav-button {
        background: none;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 6px;
        color: #1d1d1f;
        -webkit-app-region: no-drag;
      }
      .nav-button:hover {
        background: #e8e8ed;
      }
      .nav-button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }
      .nav-button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .nav-button:disabled:hover {
        background: none;
      }
      input.url {
        flex: 1;
        padding: 6px 12px;
        border: 1px solid #d2d2d7;
        border-radius: 6px;
        font-size: 13px;
        background: #ffffff;
        -webkit-app-region: no-drag;
        outline: none;
        margin: 0 4px;
      }
      input.url:focus {
        border-color: #007aff;
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
      }
      .collapse-icon {
        display: none;
      }
      .bar[data-mode="browser"] .expand-icon {
        display: none;
      }
      .bar[data-mode="browser"] .collapse-icon {
        display: block;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #e0e0e0;
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-left: 4px;
      }
      .spinner.hidden {
        visibility: hidden;
      }
      /* Tab strip — second chrome row, only while the panel is open. */
      .tabs {
        display: none;
        align-items: stretch;
        box-sizing: border-box;
        height: 32px;
        margin-left: auto;
        padding: 0 8px;
        gap: 4px;
        overflow-x: auto;
      }
      /* Full-width browser: the strip is the top row, so it must clear the
         macOS traffic lights. In split it sits to the right of them. */
      body[data-mode="browser"] .tabs {
        padding-left: 76px;
      }
      body:not([data-mode="webapp"]) .tabs {
        display: flex;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 220px;
        padding: 0 8px;
        border: none;
        border-radius: 6px 6px 0 0;
        background: transparent;
        color: #6e6e73;
        font-size: 12px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        white-space: nowrap;
      }
      .tab:hover {
        background: #e8e8ed;
      }
      .tab[data-active="true"] {
        background: #ffffff;
        color: #1d1d1f;
        box-shadow: 0 -1px 0 #d2d2d7 inset;
      }
      .tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* An agent-owned tab is visually distinct: the person must be able
         to tell at a glance which surfaces are not theirs. */
      .tab-owner {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34c759;
      }
      .tab[data-state="paused_by_user"] .tab-owner,
      .tab[data-state="awaiting_human"] .tab-owner {
        background: #ff9500;
      }
      .tab-action {
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0 2px;
        font-size: 11px;
        -webkit-app-region: no-drag;
      }
      .tab-action:hover {
        color: #007aff;
      }
      .tab-new {
        flex: 0 0 auto;
        align-self: center;
        border: none;
        background: none;
        color: #6e6e73;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        padding: 0 6px;
        -webkit-app-region: no-drag;
      }
      .tab-new:hover {
        color: #1d1d1f;
      }
      /* Hand-back bar: an agent is waiting on a person.
         Full width and above BOTH panes on purpose — it is a request for
         action, not a property of the page, so it must be visible even
         when the browser panel is closed. It pushes the content down
         rather than floating: an overlay would cover the top of the page,
         which is exactly where login forms live. */
      .banner {
        display: none;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        width: 100%;
        height: 40px;
        padding: 0 12px 0 84px;
        background: #fff4e5;
        border-bottom: 1px solid #ffd8a8;
        font-size: 12px;
        color: #7a4a00;
      }
      body[data-banner="true"] .banner {
        display: flex;
      }
      /* In split/browser the strip is the top row and already clears the
         traffic lights, so the bar sits below them. */
      body[data-banner="true"]:not([data-mode="webapp"]) .banner {
        padding-left: 12px;
      }
      .banner-more {
        flex: 0 0 auto;
        color: #a86a00;
      }
      .banner-reveal {
        flex: 0 0 auto;
        border: 1px solid #ffd8a8;
        border-radius: 6px;
        background: transparent;
        color: #7a4a00;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .banner-reveal:hover {
        background: #ffe9cc;
      }
      .banner-icon {
        flex: 0 0 auto;
        font-size: 14px;
      }
      .banner-text {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .banner-resume {
        flex: 0 0 auto;
        border: 1px solid #ff9500;
        border-radius: 6px;
        background: #ff9500;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        padding: 5px 12px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .banner-resume:hover {
        background: #e68600;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">
      <span class="banner-icon">⏸</span>
      <span class="banner-text" id="banner-text"></span>
      <span class="banner-more" id="banner-more"></span>
      <button class="banner-reveal" id="banner-reveal">Voir</button>
      <button class="banner-resume" id="banner-resume">Rendre la main</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="bar" id="bar" data-mode="webapp">
      <div class="closed-controls">
        <button class="nav-button" id="open-panel" title="Open browser panel">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2.5" y="3" width="15" height="14" rx="2"></rect>
            <path d="M12.5 3v14"></path>
          </svg>
        </button>
      </div>
      <div class="browser-controls" id="browser-controls">
        <button class="nav-button" id="back" title="Back">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"></path></svg>
        </button>
        <button class="nav-button" id="forward" title="Forward">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg>
        </button>
        <button class="nav-button" id="reload" title="Reload">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15.5 7.5A6 6 0 1 0 16 12"></path>
            <path d="M15.5 3.5v4h-4"></path>
          </svg>
        </button>
        <input
          class="url"
          id="url"
          type="text"
          placeholder="Enter URL or search…"
          spellcheck="false"
          autocomplete="off"
        />
        <span class="spinner hidden" id="spinner"></span>
        <button class="nav-button" id="focus-browser" title="Focus browser">
          <svg class="expand-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M7 3H3v4M13 3h4v4M7 17H3v-4M13 17h4v-4"></path>
          </svg>
          <svg class="collapse-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 7h4V3M17 7h-4V3M3 13h4v4M17 13h-4v4"></path>
          </svg>
        </button>
        <button class="nav-button" id="close-browser" title="Close browser panel">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"></path>
          </svg>
        </button>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const bar = $("bar");
      const tabsEl = $("tabs");
      const bannerText = $("banner-text");
      const bannerMore = $("banner-more");
      const bannerReveal = $("banner-reveal");
      const bannerResume = $("banner-resume");
      const browserControls = $("browser-controls");
      const focusButton = $("focus-browser");
      const urlInput = $("url");
      const spinner = $("spinner");

      function go() {
        let value = urlInput.value.trim();
        if (!value) return;
        // Tolerant URL handling: bare hostnames get https://, anything else
        // looks like a search query → DuckDuckGo. Keeps the UX close to a
        // real browser address bar without bloating the POC.
        const isUrlLike =
          /^https?:\/\//i.test(value) || /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(value);
        if (isUrlLike && !/^https?:\/\//i.test(value)) {
          value = "https://" + value;
        } else if (!isUrlLike) {
          value = "https://duckduckgo.com/?q=" + encodeURIComponent(value);
        }
        window.appstrate.navigate(value);
      }

      $("back").addEventListener("click", () => window.appstrate.back());
      $("forward").addEventListener("click", () => window.appstrate.forward());
      $("reload").addEventListener("click", () => window.appstrate.reload());
      $("open-panel").addEventListener("click", () => window.appstrate.togglePanel());
      $("focus-browser").addEventListener("click", () => window.appstrate.toggleBrowserFocus());
      $("close-browser").addEventListener("click", () => window.appstrate.closeBrowser());
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") go();
      });

      // Main process pushes URL updates whenever the underlying browser
      // navigates — whether triggered by the user typing here, the agent
      // calling browser.navigate, or in-page navigation.
      window.appstrate.onUrlChanged((url) => {
        if (document.activeElement !== urlInput) {
          urlInput.value = url === "about:blank" ? "" : url;
        }
      });

      window.appstrate.onLoadingChanged((loading) => {
        spinner.classList.toggle("hidden", !loading);
      });

      window.appstrate.onLayoutChanged(({ mode, browserWidth }) => {
        bar.dataset.mode = mode;
        document.body.dataset.mode = mode;
        const panelWidth = mode === "browser" ? "100%" : `${browserWidth}px`;
        browserControls.style.width = panelWidth;
        tabsEl.style.width = panelWidth;
        focusButton.title = mode === "browser" ? "Show split view" : "Focus browser";
      });

      // Tab strip. The list is owned by the main process (see tabs.ts);
      // this only renders it and sends intents back.
      function renderTabs(tabs) {
        // The bar reports EVERY waiting agent, not just the active tab:
        // it is the one surface that stays visible with the browser panel
        // closed, so a request must not be able to hide behind it.
        const waiting = tabs.filter((t) => t.human_request);
        document.body.dataset.banner = waiting.length > 0 ? "true" : "false";
        if (waiting.length > 0) {
          // Show the active tab's request when there is one, so acting on
          // the bar always matches what is on screen.
          const shown = waiting.find((t) => t.active) || waiting[0];
          const who =
            shown.owner.kind === "run" && shown.owner.agentName ? shown.owner.agentName : "L'agent";
          bannerText.textContent = `${who} : ${shown.human_request}`;
          bannerMore.textContent =
            waiting.length > 1 ? `+ ${waiting.length - 1} autre(s) en attente` : "";
          bannerReveal.style.display = shown.active ? "none" : "";
          bannerReveal.onclick = () => window.appstrate.revealTab(shown.tab_id);
          bannerResume.onclick = () => window.appstrate.resumeTab(shown.tab_id);
        }

        tabsEl.replaceChildren();
        for (const tab of tabs) {
          const el = document.createElement("div");
          el.className = "tab";
          el.dataset.active = String(tab.active);
          el.dataset.state = tab.state;

          if (tab.owner.kind === "run") {
            const dot = document.createElement("span");
            dot.className = "tab-owner";
            dot.title =
              tab.state === "awaiting_human"
                ? `${tab.owner.agentName || "L'agent"} attend une action de ta part`
                : tab.state === "paused_by_user"
                  ? "Tu as repris la main — l'agent attend"
                  : `Piloté par ${tab.owner.agentName || "un agent"}`;
            el.appendChild(dot);
          }

          const label = document.createElement("span");
          label.className = "tab-label";
          label.textContent = tab.title || hostOf(tab.url) || "New tab";
          label.addEventListener("click", () => window.appstrate.selectTab(tab.tab_id));
          el.appendChild(label);

          // Handing a tab back is an explicit act: an agent never
          // resumes on its own after a takeover.
          if (tab.state === "paused_by_user") {
            const resume = document.createElement("button");
            resume.className = "tab-action";
            resume.textContent = "↩";
            resume.title = "Give the tab back to the agent";
            resume.addEventListener("click", (e) => {
              e.stopPropagation();
              window.appstrate.resumeTab(tab.tab_id);
            });
            el.appendChild(resume);
          }

          const close = document.createElement("button");
          close.className = "tab-action";
          close.textContent = "✕";
          close.title = "Close tab";
          close.addEventListener("click", (e) => {
            e.stopPropagation();
            window.appstrate.closeTab(tab.tab_id);
          });
          el.appendChild(close);

          tabsEl.appendChild(el);
        }
        const add = document.createElement("button");
        add.className = "tab-new";
        add.textContent = "+";
        add.title = "New tab";
        add.addEventListener("click", () => window.appstrate.newTab());
        tabsEl.appendChild(add);
      }

      function hostOf(url) {
        try {
          return new URL(url).host;
        } catch {
          return "";
        }
      }

      window.appstrate.onTabsChanged(renderTabs);
      window.appstrate.listTabs().then(renderTabs);
    </script>
  </body>
</html>
