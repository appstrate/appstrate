<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Navbar</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        width: 100%;
        height: 44px;
        padding-left: 76px;
        border-bottom: 1px solid #e0e0e0;
      }
      .browser-controls {
        display: none;
        align-items: center;
        box-sizing: border-box;
        flex: 0 0 auto;
        height: 100%;
        padding: 0 8px;
        gap: 4px;
        border-left: 1px solid #e0e0e0;
      }
      .bar[data-mode="split"] .browser-controls,
      .bar[data-mode="browser"] .browser-controls {
        display: flex;
      }
      .closed-controls {
        display: flex;
        align-items: center;
        height: 100%;
        padding-right: 8px;
      }
      .bar:not([data-mode="webapp"]) .closed-controls {
        display: none;
      }
      .nav-button {
        background: none;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 6px;
        color: #1d1d1f;
        -webkit-app-region: no-drag;
      }
      .nav-button:hover {
        background: #e8e8ed;
      }
      .nav-button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }
      .nav-button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .nav-button:disabled:hover {
        background: none;
      }
      input.url {
        flex: 1;
        padding: 6px 12px;
        border: 1px solid #d2d2d7;
        border-radius: 6px;
        font-size: 13px;
        background: #ffffff;
        -webkit-app-region: no-drag;
        outline: none;
        margin: 0 4px;
      }
      input.url:focus {
        border-color: #007aff;
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
      }
      .collapse-icon {
        display: none;
      }
      .bar[data-mode="browser"] .expand-icon {
        display: none;
      }
      .bar[data-mode="browser"] .collapse-icon {
        display: block;
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #e0e0e0;
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-left: 4px;
      }
      .spinner.hidden {
        visibility: hidden;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar" data-mode="webapp">
      <div class="closed-controls">
        <button class="nav-button" id="open-panel" title="Open browser panel">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2.5" y="3" width="15" height="14" rx="2"></rect>
            <path d="M12.5 3v14"></path>
          </svg>
        </button>
      </div>
      <div class="browser-controls" id="browser-controls">
        <button class="nav-button" id="back" title="Back">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5-5 5 5 5"></path></svg>
        </button>
        <button class="nav-button" id="forward" title="Forward">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg>
        </button>
        <button class="nav-button" id="reload" title="Reload">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15.5 7.5A6 6 0 1 0 16 12"></path>
            <path d="M15.5 3.5v4h-4"></path>
          </svg>
        </button>
        <input
          class="url"
          id="url"
          type="text"
          placeholder="Enter URL or search…"
          spellcheck="false"
          autocomplete="off"
        />
        <span class="spinner hidden" id="spinner"></span>
        <button class="nav-button" id="focus-browser" title="Focus browser">
          <svg class="expand-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M7 3H3v4M13 3h4v4M7 17H3v-4M13 17h4v-4"></path>
          </svg>
          <svg class="collapse-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 7h4V3M17 7h-4V3M3 13h4v4M17 13h-4v4"></path>
          </svg>
        </button>
        <button class="nav-button" id="close-browser" title="Close browser panel">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"></path>
          </svg>
        </button>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const bar = $("bar");
      const browserControls = $("browser-controls");
      const focusButton = $("focus-browser");
      const urlInput = $("url");
      const spinner = $("spinner");

      function go() {
        let value = urlInput.value.trim();
        if (!value) return;
        // Tolerant URL handling: bare hostnames get https://, anything else
        // looks like a search query → DuckDuckGo. Keeps the UX close to a
        // real browser address bar without bloating the POC.
        const isUrlLike =
          /^https?:\/\//i.test(value) || /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(value);
        if (isUrlLike && !/^https?:\/\//i.test(value)) {
          value = "https://" + value;
        } else if (!isUrlLike) {
          value = "https://duckduckgo.com/?q=" + encodeURIComponent(value);
        }
        window.appstrate.navigate(value);
      }

      $("back").addEventListener("click", () => window.appstrate.back());
      $("forward").addEventListener("click", () => window.appstrate.forward());
      $("reload").addEventListener("click", () => window.appstrate.reload());
      $("open-panel").addEventListener("click", () => window.appstrate.togglePanel());
      $("focus-browser").addEventListener("click", () => window.appstrate.toggleBrowserFocus());
      $("close-browser").addEventListener("click", () => window.appstrate.closeBrowser());
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") go();
      });

      // Main process pushes URL updates whenever the underlying browser
      // navigates — whether triggered by the user typing here, the agent
      // calling browser.navigate, or in-page navigation.
      window.appstrate.onUrlChanged((url) => {
        if (document.activeElement !== urlInput) {
          urlInput.value = url === "about:blank" ? "" : url;
        }
      });

      window.appstrate.onLoadingChanged((loading) => {
        spinner.classList.toggle("hidden", !loading);
      });

      window.appstrate.onLayoutChanged(({ mode, browserWidth }) => {
        bar.dataset.mode = mode;
        browserControls.style.width = mode === "browser" ? "100%" : `${browserWidth}px`;
        focusButton.title = mode === "browser" ? "Show split view" : "Focus browser";
      });
    </script>
  </body>
</html>
