services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: appstrate_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Disable durability for test speed (unsafe for production, fine for tests)
    command: >
      postgres
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d appstrate_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  dind-test:
    image: docker:27-dind
    privileged: true
    ports:
      - "2375:2375"
    environment:
      DOCKER_TLS_CERTDIR: ""
    tmpfs:
      - /var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 15

  minio-test:
    # Same digest-pinned Chainguard image as every other compose file (MinIO
    # RELEASE.2026-09-22T19-25-18Z; refresh recipe in docker-compose.yml).
    # Runs as its default uid 65532 — /data is a tmpfs, nothing pre-exists.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    ports:
      # Mapped to 9012 (not 9000/9002) to avoid colliding with other
      # dev servers commonly running on those ports on the same host.
      - "9012:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER: "off"
    command: server /data
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
