services:
  # Reuse the platform image as a local, already-present stand-in for the two
  # images the Docker orchestrator verifies at boot. These one-shot services
  # inherit `entrypoint: ["true"]` from the production compose file.
  appstrate-pi:
    image: "${HEALTH_E2E_IMAGE:-appstrate-health-e2e:local}"

  appstrate-sidecar:
    image: "${HEALTH_E2E_IMAGE:-appstrate-health-e2e:local}"

  appstrate:
    image: "${HEALTH_E2E_IMAGE:-appstrate-health-e2e:local}"
    environment:
      DOCKER_SOCKET: "${HEALTH_E2E_DOCKER_SOCKET:-/var/run/docker.sock}"
      PI_IMAGE: "${HEALTH_E2E_IMAGE:-appstrate-health-e2e:local}"
      SIDECAR_IMAGE: "${HEALTH_E2E_IMAGE:-appstrate-health-e2e:local}"
      # MODULES / SYSTEM_PROVIDER_KEYS / SYSTEM_PROXIES are deliberately NOT
      # pinned here. They used to be, at values byte-identical to the Zod
      # defaults in packages/env/src/index.ts — so a module added to the schema
      # would have left this e2e testing the old set forever (#513, one level
      # down). docker-compose.yml declares all three as bare passthroughs, so
      # dropping them lets the schema default reach the container and the e2e
      # follows the platform automatically.
      S3_BUCKET: appstrate
      S3_REGION: us-east-1
      S3_ENDPOINT: http://appstrate-minio:9000
      AWS_ACCESS_KEY_ID: e2e-minio
      AWS_SECRET_ACCESS_KEY: e2e-minio-password
      SYSTEM_INTEGRATIONS: "[]"
      LOG_LEVEL: warn
