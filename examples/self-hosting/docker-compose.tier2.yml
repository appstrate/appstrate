# Appstrate — Tier 2 (PostgreSQL + Redis, filesystem storage)
#
# Generated by `appstrate install --tier 2`. The recommended
# single-node production stack (issue #829): uploaded files are kept
# on the host filesystem under `./data/storage` (a persisted volume
# mounted into the platform container) and all file traffic is served
# through the platform on APP_URL. A bundled S3-compatible object
# store (Tier 3 / MinIO) adds nothing on a single node; bring your
# own S3 endpoint via the S3_* env vars if you need one.
#
# Note: no top-level `name:` is set here — the CLI passes
# `--project-name <name>` based on `.appstrate/project.json`, so two
# installs in different directories get isolated projects. A hand-run
# of `docker compose up -d` falls back to the directory basename.

networks:
  appstrate-data:
    driver: bridge
    internal: true
  appstrate-public:
    driver: bridge

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    networks:
      - appstrate-data
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appstrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: appstrate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appstrate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - appstrate-data
    command: redis-server --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database migrations ─────────────────────────────────────
  #
  # NOTE — this is deliberately a SECOND writer to `__drizzle_migrations`: the
  # platform also migrates at boot (`apps/api/src/lib/boot.ts`). It is safe
  # because the two are SEQUENCED, never concurrent — `appstrate` declares
  # `migrate: { condition: service_completed_successfully }`, so the boot pass
  # always finds an already-migrated schema and is a no-op. Keeping this service
  # buys a clean failure mode: a bad migration fails `docker compose up` before
  # the platform ever binds a port, with an isolated exit code and log.
  #
  # Two invariants, both load-bearing:
  #   1. It MUST use the same image tag as `appstrate` (same ${APPSTRATE_VERSION})
  #      — a mismatched pair applies a migration set the running code does not
  #      expect.
  #   2. It must keep the `depends_on` gate. Drop it and you get two concurrent
  #      migrators racing the same journal.
  #
  # It does NOT run the boot-time check that refuses to start when migration
  # 0006's oauth columns are absent despite a satisfied watermark; that only
  # happens in the platform's own boot pass, which is another reason not to
  # "optimise" the platform's migration step away.
  migrate:
    image: ghcr.io/appstrate/appstrate:${APPSTRATE_VERSION:-1.0.0-beta.56}
    networks:
      - appstrate-data
    restart: "no"
    command: ["bun", "packages/db/src/migrate.ts"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@postgres:5432/appstrate
    depends_on:
      postgres:
        condition: service_healthy

  # ── Pre-pull runtime images ─────────────────────────────────
  pi-pull:
    image: ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  sidecar-pull:
    image: ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  # Per-integration MCP runner images. Pre-pulled because the SIDECAR (not the
  # platform) `docker create`s these, and it never issues an image pull — an
  # absent image is a hard failure at integration boot, not a slow first run.
  mcp-runner-node-pull:
    image: ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  mcp-runner-python-pull:
    image: ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  mcp-runner-bun-pull:
    image: ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  mcp-runner-uv-pull:
    image: ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  mcp-runner-binary-pull:
    image: ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-1.0.0-beta.56}
    entrypoint: ["true"]
    restart: "no"

  # ── Appstrate platform ─────────────────────────────────────
  appstrate:
    image: ghcr.io/appstrate/appstrate:${APPSTRATE_VERSION:-1.0.0-beta.56}
    networks:
      - appstrate-data
      - appstrate-public
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-0}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # All optional env vars live in `.env.example` (the operator contract).
    # Defaults are defined ONCE in `packages/env/src/index.ts` (Zod schema)
    # and passthrough below means an unset host env falls back to that
    # single source of truth. Only deployment-specific values (infra
    # plumbing, required secrets, intentional overrides, defensive
    # workarounds) are declared here.
    environment:
      # ── Required secrets (loud-fail when missing) ────────────────
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      - UPLOAD_SIGNING_SECRET=${UPLOAD_SIGNING_SECRET:?Set UPLOAD_SIGNING_SECRET in .env}
      - RUN_TOKEN_SECRET=${RUN_TOKEN_SECRET:?Set RUN_TOKEN_SECRET in .env}
      - CONNECT_SESSION_SECRET=${CONNECT_SESSION_SECRET:?Set CONNECT_SESSION_SECRET in .env}
      - CONNECTION_ENCRYPTION_KEY=${CONNECTION_ENCRYPTION_KEY:?Set CONNECTION_ENCRYPTION_KEY in .env}
      # ── Infra plumbing (refers to compose service hostnames) ─────
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@postgres:5432/appstrate
      - REDIS_URL=redis://redis:6379
      # No S3 / MinIO — storage goes to the host-mounted filesystem at
      # `./data/storage`. Uploaded files survive container restarts as
      # long as the `storagedata` volume is preserved.
      - FS_STORAGE_PATH=/data/storage
      # ── Coupled to YAML semantics ────────────────────────────────
      # PORT mirrors the `ports:` mapping above; DOCKER_SOCKET mirrors
      # the `volumes:` mount; PI_IMAGE/SIDECAR_IMAGE couple to
      # APPSTRATE_VERSION and the GHCR registry (overrides the code
      # default which points at Docker Hub).
      - PORT=3000
      - DOCKER_SOCKET=/var/run/docker.sock
      - PI_IMAGE=ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-1.0.0-beta.56}
      - SIDECAR_IMAGE=ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-1.0.0-beta.56}
      # Per-integration MCP runner images. The sidecar `docker create`s one of
      # these per LOCAL AFPS integration; the refs are forwarded into the
      # sidecar via SIDECAR_OPERATOR_ENV_KEYS. Without them the sidecar falls
      # back to bare `appstrate-mcp-runner-*:latest` tags, which the daemon
      # tries — and fails — to pull from Docker Hub, so every local
      # integration dies at boot. Same APPSTRATE_VERSION coupling as above.
      - RUNNER_IMAGE_NODE=ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-1.0.0-beta.56}
      - RUNNER_IMAGE_PYTHON=ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-1.0.0-beta.56}
      - RUNNER_IMAGE_BUN=ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-1.0.0-beta.56}
      - RUNNER_IMAGE_UV=ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-1.0.0-beta.56}
      - RUNNER_IMAGE_BINARY=ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-1.0.0-beta.56}
      # ── Intentional overrides (YAML default ≠ code default) ──────
      # RUN_ADAPTER: code default is `process` for OSS dev — a
      # containerized self-host must run agents in Docker.
      - RUN_ADAPTER=${RUN_ADAPTER:-docker}
      # TRUSTED_ORIGINS: code default allows dev localhost ports.
      # Prod self-host correctly defaults to empty — operator opts in
      # to their public domain explicitly.
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # ── Sidecar capacity caps (operator-tunable passthrough) ─────
      # `pickOperatorSidecarEnv` (packages/runner-pi) forwards these
      # from the platform's `process.env` into spawned sidecar and
      # agent containers. Without these lines the operator cannot
      # override the sidecar-side defaults via .env.
      - SIDECAR_MAX_REQUEST_BODY_BYTES
      - SIDECAR_MAX_MCP_ENVELOPE_BYTES
      # Sidecar token/concurrency knobs. Bare passthrough, no default: the
      # sidecar owns the compiled defaults and re-stating them here is the
      # drift class `verify:compose-defaults` exists to catch. Forwarded only
      # when the operator actually sets them.
      - SIDECAR_INLINE_TOOL_OUTPUT_TOKENS
      - SIDECAR_RUN_TOOL_OUTPUT_BUDGET_TOKENS
      - SIDECAR_API_CALL_CONCURRENCY
      # ── Defensive workaround for better-auth 1.6+ namespace clash ──
      # NOTE: empty default (NOT `{}`) — better-auth 1.6+ has its own
      # `BETTER_AUTH_SECRETS` env var with CSV `v1:secret` format and crashes
      # boot on a non-CSV value. Empty string is falsy for better-auth and
      # treated as `{}` by `@appstrate/env`. Set this in `.env` only when
      # rotating the kid map; see env docstring in `packages/env/src/index.ts`.
      - BETTER_AUTH_SECRETS=${BETTER_AUTH_SECRETS:-}
      # ── Passthroughs ─────────────────────────────────────────────
      # Defaults live in `packages/env/src/index.ts`. Unset host env
      # falls back to the Zod schema's single source of truth.
      - APP_URL
      - LOG_LEVEL
      - MODULES
      # Firecracker execution backend (set by `appstrate install
      # --run-adapter firecracker`). Empty/unset when running the default
      # Docker backend — the firecracker module only reads them when
      # RUN_ADAPTER=firecracker selects the runner orchestrator.
      - FIRECRACKER_RUNNER_URL
      - FIRECRACKER_RUNNER_TOKEN
      - SYSTEM_PROVIDER_KEYS
      # System integrations offered out of the box (shared OAuth clients, or a
      # client-less entry for DCR-based remote MCP integrations).
      - SYSTEM_INTEGRATIONS
      # Separate origin for agent-generated HTML previews. Unset => previews are
      # served same-origin on APP_URL (hardened, but a weaker XSS posture). It
      # grants NO behavioural exemption: agent HTML is rendered as ACTIVE content
      # only inside the dashboard's sandboxed iframe, in EVERY mode. What a
      # configured value buys is isolation — its own cookie jar, storage
      # partition and process — which is why boot FAILS unless its host differs
      # from APP_URL's. Point it at a second domain resolving to this server.
      - USERCONTENT_URL
      - AUTH_DISABLE_SIGNUP
      - AUTH_DISABLE_ORG_CREATION
      - AUTH_PLATFORM_ADMIN_EMAILS
      - AUTH_ALLOWED_SIGNUP_DOMAINS
      - AUTH_BOOTSTRAP_OWNER_EMAIL
      - AUTH_BOOTSTRAP_ORG_NAME
      - BETTER_AUTH_ACTIVE_KID
      - CONNECTION_ENCRYPTION_KEY_ID
      - CONNECTION_ENCRYPTION_KEYS
      - AFPS_TRUST_ROOT
      - AFPS_SIGNATURE_POLICY
      - REMOTE_RUN_SINK_DEFAULT_TTL_SECONDS
      - REMOTE_RUN_SINK_MAX_TTL_SECONDS
      - RUN_HEARTBEAT_INTERVAL_SECONDS
      - RUN_STALL_THRESHOLD_SECONDS
      - RUN_WATCHDOG_INTERVAL_SECONDS
      - RUN_BOOT_DEADLINE_SECONDS
      - RUNTIME_IMAGE_WARM_INTERVAL_SECONDS
      # ── Observability (OpenTelemetry, optional) ──────────────────
      # Off by default; a complete no-op until enabled. Enabling needs
      # @appstrate/module-observability in MODULES plus an endpoint (the vars
      # are read from process.env by the module). Full guide:
      # docs/architecture/OBSERVABILITY.md
      - OTEL_ENABLED
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_SERVICE_NAME
      - OTEL_TRUST_INCOMING_TRACE
      # Read straight from process.env by the OTLP exporters (not in the
      # Zod schema, hence no default to duplicate):
      - OTEL_EXPORTER_OTLP_HEADERS
      - OTEL_EXPORTER_OTLP_PROTOCOL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - storagedata:/data/storage
      # Co-located Firecracker runner socket dir (UDS transport): mounted at
      # /run/appstrate-runner in the container so
      # FIRECRACKER_RUNNER_URL=unix:///run/appstrate-runner/runner.sock works.
      # The HOST side is env-driven: the firecracker installer sets
      # APPSTRATE_RUNNER_SOCKET_DIR=/run/appstrate-runner in .env; without it
      # the mount falls back to a harmless empty local dir (never touches
      # /run — Docker Desktop's default file sharing does not cover it).
      - ${APPSTRATE_RUNNER_SOCKET_DIR:-./data/appstrate-runner}:/run/appstrate-runner
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pi-pull:
        condition: service_completed_successfully
      sidecar-pull:
        condition: service_completed_successfully
      mcp-runner-node-pull:
        condition: service_completed_successfully
      mcp-runner-python-pull:
        condition: service_completed_successfully
      mcp-runner-bun-pull:
        condition: service_completed_successfully
      mcp-runner-uv-pull:
        condition: service_completed_successfully
      mcp-runner-binary-pull:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  storagedata:
