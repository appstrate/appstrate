# Appstrate — production Docker Compose
#
# The DEPLOYMENT, not the product: every service PULLS a published image and
# nothing here is built. The billing module ships inside
# `ghcr.io/appstrate/appstrate` and is inert until `MODULES` names it, so this
# file requires `MODULES` rather than defaulting it (see below).
#
# Coolify:  one application resource, build pack `dockercompose`,
#           git_repository `appstrate/appstrate`, docker_compose_location and
#           watch_paths both `/deploy/docker-compose.yml`. The resource UUID is
#           deliberately not written here — it names the volumes, and a stale
#           one in a comment is worse than none.
# Manual:   cp .env.example .env && docker compose up -d
# Upgrade:  set APPSTRATE_VERSION, then `docker compose pull && up -d`.
#
# `.env.example` is the operator contract. Under Coolify the `environment:`
# blocks are NOT: Coolify injects every variable configured on the resource into
# every service whatever this file lists. The blocks are maintained for a RAW
# `docker compose` run, which is the only reader that depends on them.
#
# NOT the self-hosting example. `examples/self-hosting/docker-compose.yml`
# teaches a stock install, and the two are deliberately not merged: Coolify's
# `docker_compose_domains` maps THESE service names to app.appstrate.com and
# storage.appstrate.com, so renaming one deletes the routing, and that file's
# `internal: true` data network would cut this one's egress to the model
# providers. A change belonging in both is carried across by hand.
#
# `name:` is inert under Coolify — it overrides the project name with the
# resource UUID, so the volumes are `<uuid>_{pgdata,redisdata,miniodata}`
# whatever this says — and load-bearing off it, where a raw `docker compose`
# run keys its volumes on it. It is not `appstrate` because the self-hosting
# example claims that one, and two compose files sharing a project name share
# its volumes. The top-level `volumes:` keys are load-bearing the same way, and
# under Coolify more so: renaming `pgdata` there orphans a volume, it does not
# rename one.

name: appstrate-prod

services:
  # ── Infrastructure ──────────────────────────────────────────────────

  appstrate-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "effective_cache_size=512MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appstrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appstrate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appstrate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  appstrate-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # quay.io, NOT Docker Hub: an anonymous `docker pull minio/minio` there
  # answers "pull access denied", which fails the whole `docker compose pull`
  # and therefore the whole deploy. postgres and redis are official and stay.
  appstrate-minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appstrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  appstrate-minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appstrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-appstrate}
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://appstrate-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do sleep 1; done
        mc mb "local/$$S3_BUCKET" --ignore-existing
    depends_on:
      appstrate-minio:
        condition: service_healthy

  # ── Migrations ──
  #
  # The platform's own schema. `@appstrate/module-ee` migrates its seven `ee_*`
  # tables itself at `init()`, into this same database under its own journal
  # (`drizzle.ee_migrations`) — so there is no second migrate service.

  appstrate-migrate:
    image: ghcr.io/appstrate/appstrate:${APPSTRATE_VERSION:-1.0.0-beta.61}
    restart: "no"
    command: ["bun", "packages/db/src/migrate.ts"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@appstrate-postgres:5432/appstrate
    depends_on:
      appstrate-postgres:
        condition: service_healthy

  # ── Runtime image pull (ensure images are cached before app starts) ──

  appstrate-pi:
    image: ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  appstrate-sidecar:
    image: ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  # Per-integration MCP runner images: the sidecar `docker create`s one per
  # local AFPS integration (resolved from RUNNER_IMAGE_* below). Pre-pulled so
  # the first integration boot does not block on — or fail at — a cold pull.
  appstrate-mcp-runner-node:
    image: ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-python:
    image: ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-bun:
    image: ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-uv:
    image: ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-binary:
    image: ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-1.0.0-beta.61}
    entrypoint: ["true"]
    restart: "no"

  # ── Main application ────────────────────────────────────────────────

  appstrate:
    image: ghcr.io/appstrate/appstrate:${APPSTRATE_VERSION:-1.0.0-beta.61}
    # Browser traffic reaches port 3000 through the Coolify proxy and needs no
    # host port. This mapping serves the remote run-plane
    # (RUN_ADAPTER=firecracker-remote): microVM guests have no DNS and reach the
    # platform sink at an IPv4-literal host port. Loopback-only by default, so a
    # stock deploy exposes nothing — set PLATFORM_SINK_BIND to a private
    # interface IP to serve guests.
    ports:
      - "${PLATFORM_SINK_BIND:-127.0.0.1}:${PLATFORM_SINK_PORT:-3310}:3000"
    restart: unless-stopped
    mem_limit: 8g
    # WHAT BELONGS HERE, AND WHY THE LIST IS SHORT
    #
    # Only values THIS FILE computes: a service hostname, an image ref bound to
    # ${APPSTRATE_VERSION}, a mirror of the `ports:`/`volumes:` above, or one
    # variable remapped onto another. Everything an operator sets arrives
    # through `env_file` below, and naming it here too is not redundant, it is
    # HARMFUL: Coolify materialises every key this block names, so a bare
    # `- FOO` is rewritten into `FOO: ''` and "unset, let the schema default
    # apply" becomes "set to the empty string". `verify:compose-defaults`
    # (class 5) refuses a bare name here for that reason.
    env_file:
      - .env
    environment:
      # ── Coupled to the YAML above ──
      - PORT=3000
      - DOCKER_SOCKET=/var/run/docker.sock
      # ── Infra plumbing (refers to compose service hostnames) ──
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@appstrate-postgres:5432/appstrate
      - REDIS_URL=redis://appstrate-redis:6379
      - S3_ENDPOINT=${S3_ENDPOINT:-http://appstrate-minio:9000}
      # AWS_* are the S3 client's names for the MinIO credentials — a remap this
      # file performs, not a variable the operator sets twice.
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-appstrate}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      # ── Intentional override (YAML default differs from the code default) ──
      # RUN_ADAPTER: the code default is `process`, for OSS dev. A containerised
      # deployment must run agents in Docker.
      - RUN_ADAPTER=${RUN_ADAPTER:-docker}
      # ── Required, no fallback ──
      # MODULES: must be set and must name @appstrate/module-ee; no fallback to
      # the code default, which has no billing. Bare `:?` is the form Coolify
      # documents. See deploy/README.md.
      - MODULES=${MODULES:?}
      # ── Bound to ${APPSTRATE_VERSION} ──
      # Without these the sidecar falls back to bare `appstrate-*:latest` tags
      # and tries to pull them from Docker Hub, so every local integration dies
      # at boot.
      - PI_IMAGE=ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - SIDECAR_IMAGE=ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - RUNNER_IMAGE_NODE=ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - RUNNER_IMAGE_PYTHON=ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - RUNNER_IMAGE_BUN=ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - RUNNER_IMAGE_UV=ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-1.0.0-beta.61}
      - RUNNER_IMAGE_BINARY=ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-1.0.0-beta.61}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      appstrate-migrate:
        condition: service_completed_successfully
      appstrate-redis:
        condition: service_healthy
      appstrate-minio-init:
        condition: service_completed_successfully
      appstrate-pi:
        condition: service_completed_successfully
      appstrate-sidecar:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
