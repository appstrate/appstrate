name: Release Cloud Image

on:
  push:
    tags:
      - "v*"

# Serialize ALL release runs (single global group, NOT per-tag).
# Two different tags pushed in rapid succession would race on shared
# cross-tag state — `metadata-action` with the `latest` raw tag
# (line ~95) recomputes which version gets `:latest` based on highest
# semver seen. If v1.0.0 finishes pushing after v1.0.1, `:latest` ends
# up pointing at v1.0.0. Mirrors the appstrate `release.yml` pattern.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  # Gate the tag on the same quality bar as a PR. A tag used to publish an image
  # having run NOTHING — not `check`, not a single test — so a regression in the
  # billing sweep could ship to production unchallenged. Tag pushes don't trigger
  # `check.yml`, so it is CALLED here rather than duplicated.
  #
  # No `with:` — `check.yml` resolves the newest published OSS release itself.
  # It therefore runs against the newest OSS image, NOT necessarily the tag being
  # released, and stays FIRST on purpose. The tag-exact typecheck lives in
  # `build-and-push` (see "Typecheck against the resolved OSS image"): moving
  # this gate after `wait-for-oss-image` would delay every quality signal by up
  # to 15 minutes of polling — on a tag that is already burned if the run fails.
  # So: cheap early gate on the newest OSS image here, authoritative tag-exact
  # gate there.
  verify:
    uses: ./.github/workflows/check.yml

  # Wait for the OSS image to be available (if released in parallel)
  wait-for-oss-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 16 # 30 attempts × 30s = 15 min, +1 for warmup
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for OSS image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/appstrate:${VERSION}"
          echo "Waiting for ${IMAGE} to be available..."

          for i in $(seq 1 30); do
            if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
              echo "Image found after ${i} attempts"
              exit 0
            fi
            echo "Attempt ${i}/30 — image not yet available, waiting 30s..."
            sleep 30
          done

          # Previously this warned and let the build fall back to `:latest`.
          # That tag does not exist (the OSS release workflow's
          # `flavor: latest=auto` withholds it from every `1.0.0-beta.X`
          # prerelease), so the "fallback" only turned a clear "the OSS image
          # for this tag is not published yet" into a `manifest unknown` three
          # jobs later. And since `@appstrate/core` now comes FROM this image,
          # building cloud vX on top of some OTHER version is the exact skew
          # this repo just removed. Fail here instead.
          echo "::error::OSS image ${IMAGE} not found after 15 minutes. The cloud image is built FROM it and takes its @appstrate/core from it, so there is no safe substitute — publish the OSS release for this tag, then re-run."
          exit 1

  build-and-push:
    needs: wait-for-oss-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve OSS image version
        id: oss-version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/appstrate:${VERSION}"

          # Same reasoning as `wait-for-oss-image`: no `:latest` fallback. That
          # tag has never been published, and substituting a different OSS
          # version would ship a cloud image whose `@appstrate/core` is not the
          # one the tag claims. `wait-for-oss-image` should already have caught
          # this; this is the guard for the window between the two jobs.
          if ! docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "::error::OSS image ${IMAGE} not found. Publish the OSS release for this tag, then re-run."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Authoritative core-contract gate. `verify` typechecked against the
      # newest published OSS release, which is not necessarily the image this
      # build layers on top of. `@appstrate/core` now comes FROM that image
      # (Dockerfile symlinks /app/packages/core), so the only honest typecheck
      # is one against the resolved tag — and it must run BEFORE the push, or a
      # skewed billing module ships and is discovered at boot.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck against the resolved OSS image
        env:
          OSS_IMAGE: ghcr.io/${{ github.repository_owner }}/appstrate:${{ steps.oss-version.outputs.version }}
        run: |
          echo "Typechecking against ${OSS_IMAGE}"
          docker run --rm -v "$PWD:/cloud:ro" --entrypoint sh "${OSS_IMAGE}" -c '
            set -eu
            cp -a /cloud /work
            cd /work
            mkdir -p node_modules/@appstrate
            ln -sfn /app/packages/core node_modules/@appstrate/core
            /app/packages/core/node_modules/.bin/tsc --noEmit -p tsconfig.json
          '

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/appstrate-cloud
          # `latest=auto` tracks highest non-prerelease semver — same
          # pattern as appstrate/release.yml. Skips `:latest` for alpha.x
          # tags (which is what we want during the pre-1.0 cycle).
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPSTRATE_VERSION=${{ steps.oss-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Docker Image" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo '```sh' >> "$GITHUB_OUTPUT"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/appstrate-cloud:${VERSION}" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "Based on OSS image \`ghcr.io/${{ github.repository_owner }}/appstrate:${VERSION}\`" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
