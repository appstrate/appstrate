services:
  postgres-cloud-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cloud_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Disable durability for test speed (unsafe for production, fine for tests)
    command: >
      postgres
        -c fsync=off
        -c synchronous_commit=off
        -c full_page_writes=off
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d cloud_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-cloud-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
