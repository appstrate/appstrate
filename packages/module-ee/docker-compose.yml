# Appstrate Cloud — Docker Compose (standalone)
#
# Self-contained deployment: all OSS infrastructure + Cloud billing module.
# Works with Coolify, raw Docker Compose, or any orchestrator.
#
# Coolify:  Point to this repo, Coolify picks up docker-compose.yml automatically.
# Manual:   cp .env.cloud.example .env && docker compose up -d
# Upgrade:  docker compose pull && docker compose up -d
#
# Required environment variables:
#   POSTGRES_PASSWORD, BETTER_AUTH_SECRET, CONNECTION_ENCRYPTION_KEY,
#   MINIO_ROOT_PASSWORD, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   STRIPE_PRICE_ID_STARTER, STRIPE_PRICE_ID_PRO

name: appstrate-cloud

services:
  # ── Infrastructure ──────────────────────────────────────────────────

  appstrate-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_level=minimal"
      - "-c"
      - "max_wal_senders=0"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "effective_cache_size=512MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appstrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appstrate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appstrate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  appstrate-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  appstrate-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appstrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  appstrate-minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-appstrate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-appstrate}
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://appstrate-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do sleep 1; done
        mc mb "local/$$S3_BUCKET" --ignore-existing
    depends_on:
      appstrate-minio:
        condition: service_healthy

  # ── Migrations (OSS tables — Cloud migrations run at boot via initCloud) ──

  appstrate-migrate:
    image: appstrate-cloud
    build:
      context: .
      args:
        APPSTRATE_VERSION: ${APPSTRATE_VERSION:-latest}
    restart: "no"
    command: ["bun", "packages/db/src/migrate.ts"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@appstrate-postgres:5432/appstrate
    depends_on:
      appstrate-postgres:
        condition: service_healthy

  # ── Runtime image pull (ensure images are cached before app starts) ──

  appstrate-pi:
    image: ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  appstrate-sidecar:
    image: ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  # Per-integration MCP runner images. The sidecar `docker create`s one of
  # these per local AFPS integration (resolved from RUNNER_IMAGE_* below).
  # Pre-pulled so the first integration boot doesn't block on — or fail at —
  # an on-demand pull.
  appstrate-mcp-runner-node:
    image: ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-python:
    image: ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-bun:
    image: ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-uv:
    image: ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  appstrate-mcp-runner-binary:
    image: ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-latest}
    entrypoint: ["true"]
    restart: "no"

  # ── Main application (Cloud edition) ────────────────────────────────

  appstrate:
    image: appstrate-cloud
    # Browser traffic is routed by the Coolify proxy to container port 3000 —
    # no host port needed for that. The mapping below exists for the remote
    # run-plane (RUN_ADAPTER=firecracker-remote): microVM guests have no DNS
    # and reach the platform sink via an IPv4-literal host port
    # (FIRECRACKER_RUNNER_PLATFORM_URL on the runner daemon). Defaults to
    # loopback-only, so a stock deploy exposes nothing beyond the host —
    # set PLATFORM_SINK_BIND to a private interface IP to serve guests.
    ports:
      - "${PLATFORM_SINK_BIND:-127.0.0.1}:${PLATFORM_SINK_PORT:-3310}:3000"
    restart: unless-stopped
    mem_limit: 8g
    environment:
      # ── Core ──
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODULES=${MODULES:-oidc,webhooks,core-providers,@appstrate/cloud,@appstrate/module-codex,@appstrate/module-claude-code}
      # ── Auth / Crypto ──
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - CONNECTION_ENCRYPTION_KEY=${CONNECTION_ENCRYPTION_KEY}
      - RUN_TOKEN_SECRET=${RUN_TOKEN_SECRET:-}
      # ── Database / Redis ──
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@appstrate-postgres:5432/appstrate
      # Cloud's own billing DB — separate logical database, same Postgres instance.
      - CLOUD_DATABASE_URL=${CLOUD_DATABASE_URL:-postgresql://${POSTGRES_USER:-appstrate}:${POSTGRES_PASSWORD}@appstrate-postgres:5432/appstrate_cloud}
      - REDIS_URL=redis://appstrate-redis:6379
      # ── S3 Storage ──
      - S3_BUCKET=${S3_BUCKET:-appstrate}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://appstrate-minio:9000}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-appstrate}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      # ── Run / Sidecar ──
      - RUN_ADAPTER=${RUN_ADAPTER:-docker}
      - DOCKER_SOCKET=/var/run/docker.sock
      - PLATFORM_API_URL=${PLATFORM_API_URL:-}
      - SIDECAR_POOL_SIZE=${SIDECAR_POOL_SIZE:-2}
      - PI_IMAGE=ghcr.io/appstrate/appstrate-pi:${APPSTRATE_VERSION:-latest}
      - SIDECAR_IMAGE=ghcr.io/appstrate/appstrate-sidecar:${APPSTRATE_VERSION:-latest}
      # ── MCP runner images (forwarded to sidecar, one per local AFPS integration) ──
      - RUNNER_IMAGE_NODE=ghcr.io/appstrate/appstrate-mcp-runner-node:${APPSTRATE_VERSION:-latest}
      - RUNNER_IMAGE_PYTHON=ghcr.io/appstrate/appstrate-mcp-runner-python:${APPSTRATE_VERSION:-latest}
      - RUNNER_IMAGE_BUN=ghcr.io/appstrate/appstrate-mcp-runner-bun:${APPSTRATE_VERSION:-latest}
      - RUNNER_IMAGE_UV=ghcr.io/appstrate/appstrate-mcp-runner-uv:${APPSTRATE_VERSION:-latest}
      - RUNNER_IMAGE_BINARY=ghcr.io/appstrate/appstrate-mcp-runner-binary:${APPSTRATE_VERSION:-latest}
      # ── System config (JSON arrays) ──
      - SYSTEM_PROVIDER_KEYS=${SYSTEM_PROVIDER_KEYS:-[]}
      - SYSTEM_PROXIES=${SYSTEM_PROXIES:-[]}
      - PROXY_URL=${PROXY_URL:-}
      - OIDC_INSTANCE_CLIENTS=${OIDC_INSTANCE_CLIENTS:-[]}
      # ── Social login (optional) ──
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # ── SMTP (optional) ──
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # ── Legal (optional) ──
      - LEGAL_TERMS_URL=${LEGAL_TERMS_URL:-}
      - LEGAL_PRIVACY_URL=${LEGAL_PRIVACY_URL:-}
      # ── Cloud / Stripe ──
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID_STARTER=${STRIPE_PRICE_ID_STARTER}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO}
      # ── Auth gates (optional, native to OSS — formerly cloud-only) ──
      - AUTH_DISABLE_SIGNUP=${AUTH_DISABLE_SIGNUP:-}
      - AUTH_DISABLE_ORG_CREATION=${AUTH_DISABLE_ORG_CREATION:-}
      - AUTH_PLATFORM_ADMIN_EMAILS=${AUTH_PLATFORM_ADMIN_EMAILS:-}
      - AUTH_ALLOWED_SIGNUP_DOMAINS=${AUTH_ALLOWED_SIGNUP_DOMAINS:-}
      - AUTH_BOOTSTRAP_OWNER_EMAIL=${AUTH_BOOTSTRAP_OWNER_EMAIL:-}
      - AUTH_BOOTSTRAP_ORG_NAME=${AUTH_BOOTSTRAP_ORG_NAME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      appstrate-migrate:
        condition: service_completed_successfully
      appstrate-redis:
        condition: service_healthy
      appstrate-minio-init:
        condition: service_completed_successfully
      appstrate-pi:
        condition: service_completed_successfully
      appstrate-sidecar:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
