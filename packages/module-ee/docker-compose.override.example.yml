# Appstrate Cloud — Development Override
#
# Copy this file to docker-compose.override.yml (gitignored).
# Compose auto-merges it with docker-compose.yml.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d        # starts infra (postgres, redis, minio, runtime images)
#   cd ../appstrate && bun link @appstrate/cloud   # link cloud module
#   cd ../appstrate && bun run db:migrate           # run OSS migrations
#   cd ../appstrate && bun run dev                  # start platform on :3000

services:
  # ── Build runtime images locally ────────────────────────────────
  appstrate-pi:
    build:
      context: ../appstrate/runtime-pi
    image: appstrate-pi:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "echo 'runtime image built'"]

  appstrate-sidecar:
    build:
      context: ../appstrate/runtime-pi/sidecar
    image: appstrate-sidecar:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "echo 'sidecar image built'"]

  # ── MinIO local credentials ─────────────────────────────────────
  appstrate-minio:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  appstrate-minio-init:
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # ── Disable services handled manually in dev ────────────────────
  appstrate-migrate:
    profiles: [prod]
    build:
      context: ../appstrate

  appstrate:
    profiles: [prod]
    build:
      context: .
      args:
        APPSTRATE_VERSION: latest
