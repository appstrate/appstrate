name: Publish @appstrate/core to npm

on:
  push:
    tags:
      - "core@*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Serialize ALL core publishes — see publish-cli.yml for rationale
# (npm `latest` dist-tag race on rapid-fire tag pushes).
concurrency:
  group: publish-core
  cancel-in-progress: false

jobs:
  publish:
    name: Quality, Tests & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
        working-directory: .

      - name: TypeScript type-check
        run: tsc --noEmit

      - name: Tests
        run: bun test

      - name: Check schemas are up-to-date
        run: |
          bun run generate:schemas
          git diff --exit-code schema/ || (echo "::error::Schemas are stale — run 'bun run generate:schemas' and commit" && exit 1)

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#core@}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # ── Precondition for the lockstep gate below ────────────────────────────
      # `check-consumer-versions.ts` reads five consumer repos through the
      # GitHub contents API. ALL FIVE ARE PRIVATE (registry, cloud, portal,
      # connect-helper, module-claude-code). `secrets.GITHUB_TOKEN` is scoped to
      # THIS repo only, so for a private consumer the API answers 404 — and the
      # script treats 404 as "not present, skipping" (a legitimate outcome for a
      # repo that genuinely has no package.json at that path, so the script
      # cannot tell the two apart).
      #
      # Net effect without a cross-repo token: the gate prints
      # "0 failure(s), 0 warning(s)" and passes having verified NOTHING. That is
      # worse than having no gate at all — a fail-closed check that has never
      # once closed. Make the missing precondition loud instead.
      #
      # Bypassing stays possible, but it must be a deliberate act (set the repo
      # variable CONSUMER_DRIFT_POLICY to `warn` or `off`), never the accident
      # of an absent secret.
      - name: Assert the lockstep gate can actually run
        working-directory: .
        env:
          LOCKSTEP_TOKEN: ${{ secrets.CONSUMER_LOCKSTEP_TOKEN }}
          CONSUMER_DRIFT_POLICY: ${{ vars.CONSUMER_DRIFT_POLICY || 'fail' }}
        run: |
          if [ -n "$LOCKSTEP_TOKEN" ]; then
            echo "CONSUMER_LOCKSTEP_TOKEN is set — the lockstep gate can read the private consumer repos."
            exit 0
          fi
          MSG="CONSUMER_LOCKSTEP_TOKEN is not set. Every consumer repo (appstrate/registry, cloud, portal, connect-helper, module-claude-code) is private, so the fallback GITHUB_TOKEN gets a 404 on all of them and the lockstep gate verifies NOTHING while reporting success."
          if [ "$CONSUMER_DRIFT_POLICY" = "fail" ]; then
            echo "::error title=Consumer lockstep gate cannot run::${MSG} Fix: add a repository secret CONSUMER_LOCKSTEP_TOKEN (PAT or GitHub App token with contents:read on those repos). To publish anyway, set the repository variable CONSUMER_DRIFT_POLICY to 'warn' or 'off' — a deliberate, auditable bypass."
            {
              echo "### ❌ Consumer lockstep gate: NOT EXECUTED"
              echo ""
              echo "${MSG}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning title=Consumer lockstep gate NOT executed::${MSG} CONSUMER_DRIFT_POLICY=${CONSUMER_DRIFT_POLICY} — publishing without verifying consumer versions."
          {
            echo "### ⚠️ Consumer lockstep gate: NOT EXECUTED"
            echo ""
            echo "${MSG}"
            echo ""
            echo "Bypassed on purpose via \`CONSUMER_DRIFT_POLICY=${CONSUMER_DRIFT_POLICY}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check consumer-repo lockstep
        working-directory: .
        env:
          # No `|| secrets.GITHUB_TOKEN` fallback: it cannot read the private
          # consumer repos, and silently degrading to it is exactly what made
          # this gate inert. The step above guarantees this is non-empty unless
          # CONSUMER_DRIFT_POLICY was deliberately relaxed.
          GITHUB_TOKEN: ${{ secrets.CONSUMER_LOCKSTEP_TOKEN }}
          # `fail` blocks publish if any consumer is >= 2 minors behind.
          # Set to `warn` for an emergency hotfix that intentionally outpaces
          # consumers, or `off` to bypass entirely.
          CONSUMER_DRIFT_POLICY: ${{ vars.CONSUMER_DRIFT_POLICY || 'fail' }}
        run: bun scripts/check-consumer-versions.ts

      # Last gate before the artifact becomes immutable on npm. The `tsc --noEmit`
      # step above runs inside the workspace, where root devDependencies hoist type
      # packages into the shared node_modules — it cannot see a dependency we forgot
      # to declare. This packs the tarball and typechecks every exported subpath in
      # a clean npm project outside the monorepo (~5 s, installs from npm).
      # It also enforces the leaf-first release order: a bumped
      # @appstrate/afps-shared range that is not on npm yet fails here rather than
      # for the first consumer to run `npm install`.
      - name: Verify the published artifact resolves for consumers
        working-directory: .
        run: bun scripts/verify-package-resolves.ts packages/core

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
