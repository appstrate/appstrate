name: System-package conformance monitor

on:
  schedule:
    # Weekly — Mondays 06:00 UTC. Remote servers are upstream-controlled; this
    # catches MCP tool-catalog drift, credential-only auth-liveness, OAuth
    # authorization-server metadata conformance and identity-endpoint liveness
    # (--tier all) out of band from the merge gate, which only runs the
    # deterministic local checks.
    #
    # The metadata check deliberately does NOT gate merges: it reads documents
    # served by third parties, so a provider outage or a rename on their side
    # would redden every unrelated PR. Weekly, with an issue on drift, matches
    # how fast those documents actually change.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: bun install

      - name: Run conformance (all tier)
        id: run
        env:
          # Opt-in credentials: JSON map of package id → bearer access token,
          # e.g. {"@appstrate/stripe":"sk_test_..."}. Absent → auth-gated
          # servers report a "skipped" WARN instead of being tested.
          CONFORMANCE_TOKENS: ${{ secrets.CONFORMANCE_TOKENS }}
        run: |
          # `set +e` keeps a failing harness from killing the step, so the
          # report below still gets written and the issue still gets filed.
          # The exit code is re-raised by the final step of this job — that
          # step, not this one, is what makes drift red.
          set +e
          {
            echo "## System-package conformance — \`--tier all\`"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
          } > conformance-report.md
          # Pipeline must stay in THIS shell so PIPESTATUS reflects the run's
          # exit code (a `{ … } | tee` brace-group would capture it in a
          # subshell and lose it — opening the issue on every run).
          bun run test:system-packages --tier all --snapshot-out conformance-snapshot 2>&1 | tee -a conformance-report.md
          code=${PIPESTATUS[0]}
          echo '```' >> conformance-report.md
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Upload live tool-surface snapshot
        # Full name+description+inputSchema per remote MCP server, fetched fresh
        # this run. Diff against an earlier run's artifact to inspect upstream
        # drift — there is no committed baseline.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-tool-snapshot
          path: conformance-snapshot/
          if-no-files-found: ignore

      - name: Open or update tracking issue
        # Only `fail` findings (real parity drift / SSRF) flip the exit code.
        # "couldn't test" WARNs (no credential, upstream down) do not, so a
        # credential-less monitor stays quiet until a genuine mismatch lands.
        # The same condition gates the failure step below — issue and red run
        # are two readings of one signal, never one without the other.
        if: steps.run.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create conformance \
            --color B60205 \
            --description "System-package conformance monitor" 2>/dev/null || true
          title="System-package conformance drift detected"
          existing=$(gh issue list --state open --label conformance --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file conformance-report.md
          else
            gh issue create --title "$title" --label conformance --body-file conformance-report.md
          fi

      - name: Fail on conformance drift
        # The harness's exit code, re-raised. It is captured rather than left
        # to fail the step above BECAUSE the issue must be filed first: a job
        # that dies on the harness never reaches the reporting step, so a red
        # run would destroy its own diagnostics. Ordering, not leniency —
        # without this step the job is green no matter what the harness found,
        # and drift lives only in an issue nobody is paged for (#1206 sat open
        # and uncommented for three days behind a green monitor).
        #
        # `always()` is deliberately NOT used: if an earlier step failed, that
        # failure already reddens the job and re-raising a possibly-unset code
        # on top of it only obscures which step broke.
        if: steps.run.outputs.code != '0'
        env:
          # Through the environment rather than `${{ }}` interpolated into the
          # script: a step output is untrusted input to the shell by policy,
          # even when — as here — it can only ever be `${PIPESTATUS[0]}`.
          CONFORMANCE_EXIT_CODE: ${{ steps.run.outputs.code }}
        run: |
          echo "Conformance harness exited ${CONFORMANCE_EXIT_CODE} — see the tracking issue." >&2
          exit "${CONFORMANCE_EXIT_CODE}"
