name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned — resolving "latest" via the unauthenticated GitHub API
          # hits the 60 req/hour IP rate limit intermittently on shared
          # runners and 404s with an empty version string.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # No `bun install`, and not as an optimisation: `bun audit` reads
      # `bun.lock` and needs nothing else. MEASURED 2026-09-07 — `package.json`
      # and `bun.lock` copied alone into an empty directory produced a report
      # identical to the one this repo yields with `node_modules` present (20
      # packages, 66 advisories). Installing first would cost a full dependency
      # resolution and change nothing the gate reads.
      #
      # `DEPENDENCY_AUDIT_POLICY` is deliberately NOT set here.
      # `readGatePolicy` pins the policy to `fail` whenever `CI` is truthy, so
      # setting it would restate a guarantee that already holds — and would
      # imply the pin is missing to anyone who reads this file looking for it.
      - name: Audit dependencies for known vulnerabilities
        run: bun run audit:deps
