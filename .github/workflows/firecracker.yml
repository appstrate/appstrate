name: Firecracker smoke

# End-to-end smoke of the Firecracker orchestrator (RUN_ADAPTER=firecracker):
# builds the guest kernel/rootfs artifacts, runs the focused unit tests, then
# boots a REAL microVM through the orchestrator (apps/api/src/modules/firecracker/scripts/dev/).
# GitHub's Linux runners expose KVM, so this runs on ubuntu-latest.
#
# This list mirrors the source closure copied by runtime-pi/Dockerfile,
# runtime-pi/sidecar/Dockerfile, and Dockerfile.rootfs, plus the two shared
# orchestrator helpers imported by the Firecracker engine. Keep it aligned with
# those build inputs: unrelated platform/test changes belong to the generic
# check/test workflows and must not pay for a microVM boot.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/modules/firecracker/**"
      - "apps/api/src/services/orchestrator/sidecar-env.ts"
      - "apps/api/src/services/orchestrator/subprocess-util.ts"
      - "apps/api/package.json"
      - "packages/afps-runtime/src/**"
      - "packages/afps-runtime/package.json"
      - "packages/afps-shared/src/**"
      - "packages/afps-shared/package.json"
      - "packages/connect/src/**"
      - "packages/connect/package.json"
      - "packages/core/src/**"
      - "packages/core/package.json"
      - "packages/mcp-transport/src/**"
      - "packages/mcp-transport/package.json"
      - "packages/runner-pi/src/**"
      - "packages/runner-pi/package.json"
      - "runtime-pi/*.ts"
      - "runtime-pi/mcp/**"
      - "runtime-pi/package.json"
      - "runtime-pi/Dockerfile"
      - "runtime-pi/sidecar/*.ts"
      - "runtime-pi/sidecar/package.json"
      - "runtime-pi/sidecar/Dockerfile"
      - ".dockerignore"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "patches/**"
      - ".github/actions/bun-setup/**"
      - ".github/workflows/firecracker.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/modules/firecracker/**"
      - "apps/api/src/services/orchestrator/sidecar-env.ts"
      - "apps/api/src/services/orchestrator/subprocess-util.ts"
      - "apps/api/package.json"
      - "packages/afps-runtime/src/**"
      - "packages/afps-runtime/package.json"
      - "packages/afps-shared/src/**"
      - "packages/afps-shared/package.json"
      - "packages/connect/src/**"
      - "packages/connect/package.json"
      - "packages/core/src/**"
      - "packages/core/package.json"
      - "packages/mcp-transport/src/**"
      - "packages/mcp-transport/package.json"
      - "packages/runner-pi/src/**"
      - "packages/runner-pi/package.json"
      - "runtime-pi/*.ts"
      - "runtime-pi/mcp/**"
      - "runtime-pi/package.json"
      - "runtime-pi/Dockerfile"
      - "runtime-pi/sidecar/*.ts"
      - "runtime-pi/sidecar/package.json"
      - "runtime-pi/sidecar/Dockerfile"
      - ".dockerignore"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "patches/**"
      - ".github/actions/bun-setup/**"
      - ".github/workflows/firecracker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecracker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Cold cache pays the full ~20 min kernel build + the rootfs docker
    # builds before the smoke even starts — 30 min would loop forever
    # without ever saving the kernel cache.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Enable KVM access
        # GitHub's Linux runners expose nested virt on most pools, but the kvm
        # module is not always pre-loaded and the /dev/kvm node can appear a
        # beat after the udev trigger. Load the module explicitly, then poll
        # for the node so a transient race doesn't red the whole 20-min build.
        run: |
          set -euo pipefail
          sudo modprobe kvm 2>/dev/null || true
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in $(seq 1 20); do
            [ -e /dev/kvm ] && break
            sleep 0.5
          done
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            echo "::error::/dev/kvm unavailable on this runner — nested virt not exposed by the host pool" >&2
            ls -l /dev/kvm 2>&1 || true
            exit 1
          fi

      - name: Install Firecracker
        # Pinned release + published checksum — never `latest` (supply chain).
        # Keep FC_VERSION/FC_SHA256 in sync with apps/api/src/modules/firecracker/scripts/dev/lima.yaml.
        run: |
          FC_VERSION="v1.16.0"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  FC_SHA256="bd04e26952d4e158085778c6230a0b383d2619c319182e27eaa9d61a212e92d6" ;;
            aarch64) FC_SHA256="531c713cdbc37d4b8bc2533d851aabc0267096afa1768086a37672abb668efd7" ;;
            *) echo "unsupported arch $ARCH" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/firecracker.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-${ARCH}.tgz"
          echo "${FC_SHA256}  /tmp/firecracker.tgz" | sha256sum -c -
          tar -xzf /tmp/firecracker.tgz -C /tmp
          sudo install -m 0755 "/tmp/release-${FC_VERSION}-${ARCH}/firecracker-${FC_VERSION}-${ARCH}" /usr/local/bin/firecracker
          # The jailer ships in the SAME verified tarball — the smoke boots
          # jailed VMMs (FIRECRACKER_JAILER=on is the orchestrator default).
          sudo install -m 0755 "/tmp/release-${FC_VERSION}-${ARCH}/jailer-${FC_VERSION}-${ARCH}" /usr/local/bin/jailer
          # The jailer input trust-chain check (initializeJailer →
          # assertTrustedPathChain) walks EVERY parent of the binary up to `/`
          # and refuses any component that is group/world-writable or not
          # root-owned — exactly as it would on a misconfigured production
          # host. Runner images violate that somewhere on the /usr/local/bin
          # chain, and WHICH component varies by runner instance: /usr/local/bin
          # ships mode 777, and /usr/local or even /usr can come owned by uid
          # 1001 (the `runner` user). It does not track the image tag —
          # ubuntu24/20260726.254 was observed both passing and failing within
          # the same three hours — so it cannot be handled by pinning an image.
          #
          # Walk the same chain the guard walks instead of naming components:
          # a previous attempt fixed /usr/local by hand and the failure simply
          # moved up to /usr. `chmod go-w` clears exactly the bits the guard
          # rejects and leaves everything else alone.
          # Record the pre-normalisation state. Without it a green run is
          # silent about WHICH runner it drew, and the whole difficulty here
          # was that the broken state appears on only some instances.
          echo "--- path chain before normalisation ---"
          stat -c '%n uid=%u mode=%a' / /usr /usr/local /usr/local/bin
          for bin in /usr/local/bin/firecracker /usr/local/bin/jailer; do
            p="$(dirname "$bin")"
            while [ "$p" != "/" ]; do
              sudo chown root:root "$p"
              sudo chmod go-w "$p"
              p="$(dirname "$p")"
            done
          done
          # Assert the invariant HERE. The guard runs ~90s into the smoke,
          # inside the orchestrator, so an unmet precondition surfaced there
          # reads as a product failure; surfaced here it reads as what it is.
          # `/` is asserted but never chown'd — if the root inode itself is
          # wrong, failing loudly is the only correct move.
          for bin in /usr/local/bin/firecracker /usr/local/bin/jailer; do
            p="$bin"
            while :; do
              owner="$(stat -c '%u' "$p")"
              [ "$owner" = "0" ] || { echo "::error::$p is owned by uid $owner, not root"; exit 1; }
              mode="$(stat -c '%a' "$p")"; mode="${mode: -3}"
              if [ $(( ${mode:1:1} & 2 )) -ne 0 ] || [ $(( ${mode:2:1} & 2 )) -ne 0 ]; then
                echo "::error::$p is group/world-writable (mode $mode)"; exit 1
              fi
              [ "$p" != "/" ] || break
              p="$(dirname "$p")"
            done
          done
          firecracker --version
          jailer --version

      # The kernel is BUILT (CI kernels lack nftables — see build-kernel.sh).
      # First build ~20 min; afterwards this cache short-circuits it.
      # Explicit restore/build/save split (NOT the monolithic actions/cache):
      # the monolithic post-step only saves on job SUCCESS, so a failing or
      # cancelled smoke — exactly what an iterating branch produces — would
      # discard the 20-min build and re-pay it on every push.
      - name: Restore guest kernel cache
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: data/firecracker/vmlinux
          key: fc-kernel-${{ runner.arch }}-${{ hashFiles('apps/api/src/modules/firecracker/scripts/build-kernel.sh') }}

      - name: Build guest kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: bash apps/api/src/modules/firecracker/scripts/build-kernel.sh data/firecracker/vmlinux

      - name: Save guest kernel cache
        if: >-
          always() && steps.kernel-cache.outputs.cache-hit != 'true' &&
          hashFiles('data/firecracker/vmlinux') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: data/firecracker/vmlinux
          key: fc-kernel-${{ runner.arch }}-${{ hashFiles('apps/api/src/modules/firecracker/scripts/build-kernel.sh') }}

      - name: Run smoke suite
        # No platform secrets: the FirecrackerOrchestrator is decoupled from
        # @appstrate/env — the smoke harness drives it with FIRECRACKER_*
        # alone (same posture as the appstrate-runner daemon).
        env:
          # The GH workspace path is too deep for the jailed VMM's AF_UNIX
          # API socket (<data>/../jail/<vmm>/<jailId>/root/run/… blows the
          # ~108-byte sun_path cap — computeJailPaths refuses at boundary
          # creation), and /tmp is out too (world-writable 1777 — the jailer
          # input trust-chain check refuses sticky dirs by design). Use
          # /var/lib/fc: short, a root-owned 0755 chain (created below, the
          # same posture as the production /var/lib/appstrate-runner), and on
          # the SAME filesystem as the checkout on GH runners so the jail's
          # kernel/rootfs hardlinks still work (EXDEV guard in jail.ts).
          FIRECRACKER_DATA_DIR: /var/lib/fc/runs
        run: |
          sudo mkdir -p /var/lib/fc
          bash apps/api/src/modules/firecracker/scripts/dev/vm-smoke.sh

      # The smoke now runs as root (jailed VMMs — FIRECRACKER_JAILER=on),
      # so the leftover run dirs are root-owned 0700; the artifact upload
      # runs as the runner user and needs read access.
      - name: Make run dirs readable for artifact upload
        if: failure()
        run: sudo chmod -R a+rX /var/lib/fc/runs 2>/dev/null || true

      - name: Upload guest console on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firecracker-run-dirs
          path: /var/lib/fc/runs/**/console.log
          if-no-files-found: ignore
