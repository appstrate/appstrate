name: Release Docker Images + CLI Binaries

on:
  push:
    tags:
      - "v*"

# Serialize ALL release runs (single global group, NOT per-tag).
# Two different tags pushed in rapid succession would otherwise race
# on shared cross-tag state:
#   - `metadata-action` with `flavor: latest=auto` (line ~82) pushes
#     the GHCR `:latest` tag based on highest-semver-seen — if v1.0.0
#     finishes after v1.0.1, `:latest` ends up pointing at v1.0.0.
#   - GH Release marking (which tag is `latest`) has the same hazard.
# `cancel-in-progress: false` because once a release has started
# publishing to GHCR / signing binaries / creating the GH Release,
# cancelling mid-flight leaves registries inconsistent — better to
# let it finish, then run the queued tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write
  # SLSA build provenance via `actions/attest-build-provenance`, in two
  # places: the CLI binaries in `sign-cli` (alongside the minisign-signed
  # checksums) and every pushed image in `build-and-push`. The image
  # attestation also needs the `packages: write` above, because it stores
  # its bundle as an OCI referrer next to the image.
  # `scan-images` overrides this block with a read-only one plus
  # `security-events: write` — it neither signs nor publishes anything.
  id-token: write
  attestations: write

jobs:
  # ─── Release preflight: the shipped compose files must name THIS tag ───────
  #
  # `verify:release-version` has two arms (see the module header in
  # scripts/verify-release-version.ts). `check.yml` runs the FLOOR arm on every
  # PR — "not behind the newest tag" — and that arm structurally CANNOT catch a
  # release whose compose files were never bumped: at the moment `v1.2.3` is
  # pushed, the newest tag it can see IS `v1.2.3`, and on the PR that merged the
  # commit the newest tag was still `v1.2.2`, which a `1.2.2` fallback matched
  # exactly. The window between "merge the bump" and "push the tag" is precisely
  # where a half-done bump hides, and until this job existed the EXACT arm ran
  # nowhere at all — a documented protection that could not fire.
  #
  # `GITHUB_REF_TYPE=tag` is set by GitHub on a tag push, so the gate demands the
  # shipped `${APPSTRATE_VERSION:-…}` fallbacks and literal image pins EQUAL
  # `github.ref_name` — the same value fed to the Dockerfile as `APP_VERSION`
  # and the same value GHCR's `{{version}}` tag carries.
  #
  # It gates the four ROOT publishing jobs; `sign-cli` and `release` already
  # depend on those transitively, so nothing reaches GHCR, the signed binaries or
  # the GH Release before this passes. Failing here costs a version bump
  # (release.yml has no `workflow_dispatch`) — the correct price, and far below
  # published images whose compose files point at the previous release.
  #
  # No `fetch-tags` here: the exact arm reads the ref, not the tag namespace.
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: bun install

      - name: Shipped compose/env files must name ${{ github.ref_name }}
        run: bun scripts/verify-release-version.ts

  build-and-push:
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      # Matrix size, so `scan-images` can assert it scanned EVERY image this job
      # pushed instead of however many digest artifacts happened to arrive. Every
      # leg writes the same value, so the usual "a matrix job's outputs clobber
      # each other" hazard is harmless here — that is why it is `strategy.job-total`
      # and not something derived from `matrix.name`.
      image-count: ${{ steps.matrix-size.outputs.total }}
    # 90, not 30. These are multi-arch builds (`linux/amd64,linux/arm64`) whose
    # `linux/arm64` half runs under QEMU emulation on an amd64 runner, and the
    # only thing that normally keeps them short is the `type=gha` layer cache.
    # That cache is a single repo-wide 10 GB LRU shared with every other
    # workflow, so an ordinary run of Test/Firecracker/preview between two
    # releases can evict it. A warm build of the `appstrate` image takes ~7-9
    # min (beta.41: 6m44, beta.42: 8m41); the cold build that follows an
    # eviction emulates the whole web bundle on arm64 and blew past 30 min,
    # which cancelled v1.0.0-beta.43 mid-flight and burnt the tag (release.yml
    # has no `workflow_dispatch`, so a cancelled release costs a version bump).
    # The ceiling exists to catch a genuinely hung build, not to bound a cold
    # cache — keep it well above the cold-build cost.
    timeout-minutes: 90
    strategy:
      matrix:
        # ⚠️  DUPLICATED MATRIX — keep in lockstep with the identical `include:`
        # block in .github/workflows/preview.yml. GitHub Actions has no
        # first-class way to share a matrix across workflows (a reusable
        # workflow would have to absorb release.yml's extra steps: the
        # Firecracker pubkey bake, multi-arch buildx, and SLSA attestation), so
        # this stays a deliberate copy. Adding or renaming an image here means
        # editing preview.yml too — otherwise preview deploys silently lack the
        # image and the runner that needs it fails at integration boot.
        include:
          - name: appstrate
            context: .
            dockerfile: Dockerfile
          - name: appstrate-pi
            context: .
            dockerfile: ./runtime-pi/Dockerfile
          - name: appstrate-sidecar
            context: .
            dockerfile: ./runtime-pi/sidecar/Dockerfile
          # Per-integration MCP runner images. Spawned by the sidecar via
          # `docker create` when an AFPS integration declares a local
          # `server.type` — the sidecar resolves the GHCR ref from
          # `RUNNER_IMAGE_*` (docker-compose). Without these published, the
          # daemon falls back to a Docker Hub pull of the bare tag and fails
          # with "pull access denied".
          - name: appstrate-mcp-runner-node
            context: ./runtime-pi/runners/node
            dockerfile: ./runtime-pi/runners/node/Dockerfile
          - name: appstrate-mcp-runner-python
            context: ./runtime-pi/runners/python
            dockerfile: ./runtime-pi/runners/python/Dockerfile
          - name: appstrate-mcp-runner-bun
            context: ./runtime-pi/runners/bun
            dockerfile: ./runtime-pi/runners/bun/Dockerfile
          - name: appstrate-mcp-runner-uv
            context: ./runtime-pi/runners/uv
            dockerfile: ./runtime-pi/runners/uv/Dockerfile
          - name: appstrate-mcp-runner-binary
            context: ./runtime-pi/runners/binary
            dockerfile: ./runtime-pi/runners/binary/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Firecracker manifest-signing pubkey bake (appstrate image only) ──
      # The `appstrate` image ships apps/api SOURCE (no build step), so a
      # self-hosted user can run the runner daemon from it. Bake the real
      # Ed25519 public key over the `__FIRECRACKER_ARTIFACTS_ED25519_PUBKEY__`
      # placeholder in runner/artifacts.ts BEFORE the image build, so shipped
      # source pins the key this release's manifest is signed with (the
      # `Sign Firecracker manifest` step in the `release` job uses the same
      # secret). Fail-closed, mirroring the minisign guard in sign-cli: a
      # release where some builds pin the real key and others still carry the
      # placeholder (mixed signed/unsigned) is worse than a failed release —
      # an unreplaced placeholder makes the daemon refuse to boot
      # (FatalArtifactsError "signing key is not provisioned").
      - name: Setup Bun (Firecracker pubkey derivation)
        if: matrix.name == 'appstrate'
        uses: ./.github/actions/bun-setup

      - name: Bake Firecracker manifest signing pubkey
        if: matrix.name == 'appstrate'
        # Shared with the `build-runner-daemon` job — single source of the bake
        # logic (scripts/bake-firecracker-pubkey.sh) so the two call sites
        # cannot drift. Zero-dep script (node:crypto only) — no `bun install`.
        env:
          FIRECRACKER_MANIFEST_SIGNING_KEY: ${{ secrets.FIRECRACKER_MANIFEST_SIGNING_KEY }}
        run: bash scripts/bake-firecracker-pubkey.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # `flavor: latest=auto` makes metadata-action add `latest` for
          # the highest non-prerelease semver tag seen — so `v1.0.0`
          # gets `latest`, but `v1.0.0-alpha.50` does NOT. Replaces a
          # previous `type=raw,value=latest,enable={{is_default_branch}}`
          # which never fired on tag-triggered runs (`is_default_branch`
          # is only true for pushes to the default branch, not tags) —
          # leaving `get.appstrate.dev` bootstrap users pulling `:latest`
          # against an image that was never tagged. The CLI now pins
          # `APPSTRATE_VERSION` in the generated `.env` for a belt-and-
          # braces guarantee (ADR-006 lockstep — the ADR itself lives in the
          # private docs repo, there is no docs/adr/ here), so `latest` is the
          # compat fallback for consumers that skip the CLI.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # One SBOM per platform, attached to the pushed index as an extra
          # attestation manifest. BuildKit's native SBOM rather than a syft step
          # because syft would have to scan ONE image — a multi-arch manifest has
          # no filesystem to walk — so it would describe linux/amd64 while being
          # published as the SBOM of a two-platform release. `sbom: true` runs the
          # scanner once per platform inside the build, which is the only shape
          # that is actually true of what ships.
          #
          # `provenance:` is deliberately left unset rather than turned on.
          # MEASURED 2026-09-08 against the shipped 1.0.0-beta.57 index:
          #   docker buildx imagetools inspect \
          #     ghcr.io/appstrate/appstrate:1.0.0-beta.57 --format '{{ json .Provenance }}'
          # already prints a full SLSA statement carrying
          # `runDetails.metadata.buildkit_metadata` (the mode=max marker — public
          # repos get mode=max by default) and `resolvedDependencies` naming the
          # base image `pkg:docker/oven/bun@1.3.14-alpine`. The same command's
          # `.SBOM` printed `{}`. So provenance metadata was never the gap; a
          # SIGNED provenance statement was, and that is the next step — the
          # BuildKit attestation is unsigned build metadata that nothing binds to
          # this repository and `gh attestation verify` cannot read.
          sbom: true
          # Stamp the deployed build identity into the image. Only the main
          # Dockerfile declares these ARGs; other matrix images ignore them.
          #
          # The runtime-pi / sidecar images need no build-arg of their own: the
          # `labels:` input below carries metadata-action's OCI set, and a
          # `--label` overrides the Dockerfile's `LABEL`, so released images
          # already carry a real `org.opencontainers.image.revision` (verified
          # on 1.0.0-beta.51). That label is what the platform compares to warn
          # on a mismatched runtime/sidecar pair (#1200) — do not drop the
          # `labels:` input without feeding BUILD_REVISION instead.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed SLSA provenance over the pushed image, from the SAME action the
      # CLI binaries get in `sign-cli` — so "how do I verify what Appstrate
      # shipped" has one answer for a binary and an image instead of two.
      #
      # `subject-digest` is the INDEX digest that `build-push-action` returns, so
      # a single attestation covers linux/amd64 + linux/arm64 + the SBOM
      # attestation manifests above. Attesting per-platform digests instead would
      # produce two statements neither of which describes the thing a consumer
      # actually pulls (the tag resolves to the index).
      - name: Attest image provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Also store the bundle as an OCI referrer beside the image, so
          # `gh attestation verify --bundle-from-oci` works for anyone who can
          # pull from GHCR without hitting this repo's attestation API. The GHCR
          # login above supplies the credentials; no extra secret.
          push-to-registry: true

      # ── Hand the scan job the exact bytes this leg pushed ──────────────────
      #
      # The scan job derives WHICH images to scan from these files instead of
      # carrying a third hand-maintained copy of the matrix above (this file and
      # preview.yml already keep two in lockstep by hand, and the header says
      # loudly what that costs). Digest-pinned, not tag-pinned: the scan then
      # reads the bytes this build produced rather than whatever the tag resolves
      # to by the time the scan runs.
      #
      # `if-no-files-found: error` is the load-bearing half — it is what makes
      # "pushed" imply "has a digest file", so an image cannot reach GHCR and
      # skip the scan.
      - name: Record pushed digest
        run: |
          set -euo pipefail
          printf '%s@%s\n' \
            "${REGISTRY}/${{ github.repository_owner }}/${{ matrix.name }}" \
            "${{ steps.build.outputs.digest }}" > "${{ matrix.name }}.ref"
          cat "${{ matrix.name }}.ref"

      - name: Publish matrix size
        id: matrix-size
        run: echo "total=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: Upload pushed digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # NOT named `appstrate-*`: `sign-cli` and `release` download that
          # pattern, and both carry a comment recording that stray artifacts in
          # it flake the blob download.
          name: image-digest-${{ matrix.name }}
          path: ${{ matrix.name }}.ref
          if-no-files-found: error
          retention-days: 7

  # ─── Vulnerability scan of the eight published images ─────────────────────
  #
  # Until this job existed the supply-chain work in this workflow covered the CLI
  # binaries only (`sign-cli`: minisign + SLSA attestation) while the images —
  # the artifacts that actually run customer workloads — were published unscanned.
  #
  # ─── Why a separate job, after the push ──────────────────────────────
  #
  # Not inside `build-and-push`: that job's `timeout-minutes: 90` exists because a
  # cold multi-arch build already blew past 30 minutes and burnt v1.0.0-beta.43
  # (see its comment). Anything added to its per-leg steps is drawn from the
  # budget of the one job in this workflow with a history of exceeding it. Here
  # the scans run in a job with its own clock, and the whole eight-image sweep is
  # bounded by `timeout-minutes: 20`.
  #
  # The cost of that shape, stated plainly: the images are already in GHCR when
  # the scan runs, `:latest` included. This job cannot un-publish them. What it
  # gates is the `release` job — the GitHub Release, the signed CLI bundle and
  # the Firecracker manifest, i.e. everything `bootstrap.sh` and
  # `appstrate runner install` read. Scanning BEFORE the push would mean building
  # each image twice (a loadable single-platform build, then the multi-arch push)
  # inside exactly the job that must not grow. Recovering from a red scan is a
  # base-image bump and a new tag, the same price as any other release failure
  # here.
  #
  # ─── Fail vs report ──────────────────────────────────────────────────
  #
  # Split, and NOT the same split `scripts/audit-dependencies.ts` makes. That gate
  # runs on `pull_request`, where a false red costs a push and an allowlist entry
  # can be added in the same PR. This one runs on a tag, in a workflow with no
  # `workflow_dispatch`, where a false red costs a version bump and an allowlist
  # entry would ALSO cost a version bump — so an allowlist buys nothing here and
  # there deliberately is none. No `.trivyignore`: an allowlist nobody can check
  # in both directions rots into the museum of old fixes that
  # `audit-dependencies.ts` was built to avoid being.
  #
  #   - FAIL on OS-package CRITICALs that have a fixed version.
  #   - REPORT everything else — both package types, every severity, fixed and
  #     unfixed — as SARIF in the Security tab beside CodeQL and Scorecard.
  #
  # `--pkg-types os` on the failing arm is the load-bearing narrowing, and it comes
  # from a MEASUREMENT, not from taste. trivy 0.74.0 against all eight published
  # 1.0.0-beta.57 images, 2026-09-08 — os-pkg findings / of those, CRITICAL with a
  # fix / CRITICALs anywhere in the image:
  #
  #   appstrate                     50 / 0 / 5     appstrate-mcp-runner-node    50 / 2 / 2
  #   appstrate-pi                  50 / 0 / 1     appstrate-mcp-runner-python  50 / 2 / 2
  #   appstrate-sidecar             12 / 0 / 0     appstrate-mcp-runner-binary  50 / 2 / 2
  #   appstrate-mcp-runner-bun      20 / 0 / 0     appstrate-mcp-runner-uv       6 / 0 / 0
  #
  # Read the two columns against each other. Every CRITICAL in `appstrate` and
  # `appstrate-pi` is in the LANGUAGE layer — protobufjs and shell-quote from
  # `node_modules`, plus CVE-2024-24790 / CVE-2025-68121 in the Go stdlib
  # statically linked into the prebuilt `@esbuild/linux-*` binaries. Failing on
  # those would make this gate red on findings whose remedy is not in this repo,
  # which is the shape phase 1 explicitly refused ("a gate red from its first run
  # is a gate people learn to ignore"). They are not dropped: the npm half is what
  # `audit-dependencies.ts` already gates on every PR, with the dated allowlist
  # this workflow cannot have, and the SARIF below carries all of it either way.
  #
  # The three runner images are the other case, and they are why the failing set is
  # not empty theatre. Their 2 criticals each are ONE advisory — CVE-2026-31789,
  # libcrypto3/libssl3 3.3.3-r0 with a fix in 3.3.7-r0 — because
  # `runtime-pi/runners/{node,python,binary}/Dockerfile` still pin
  # `ARG RUNTIME_IMAGE=alpine:3.21.3` while everything else moved to alpine 3.22.4.
  # A base-image pin left behind, a critical openssl CVE riding on it, and a
  # one-line remedy per file: exactly what this arm exists to stop, found on the
  # first real run.
  #
  # THIS GATE IS THEREFORE RED UNTIL THOSE THREE PINS ARE BUMPED. That is the
  # intended behaviour and not an allowlist candidate — it is five minutes of work,
  # not a backlog. Delete this paragraph once they are bumped.
  #
  # `--ignore-unfixed` is the other half of not being the 2am hazard: a freshly
  # published critical with no upstream patch cannot be acted on by anyone, and
  # blocking every release until a third party ships is not a security control.
  #
  # ─── What it does not see ────────────────────────────────────────────
  #
  # ONE PLATFORM. Given a multi-arch index, trivy resolves the manifest matching
  # the host it runs on — `linux/amd64` here (measured on an arm64 host, where the
  # same command resolved the arm64 half). `--platform linux/arm64` would cover
  # the other, at roughly double the sweep, and it is not set: the failing arm is
  # OS packages, and both halves come from the same `oven/bun:*-alpine` tag with
  # the same apk versions. What the arm64 half can hold that amd64 does not is a
  # different vendored binary (`@esbuild/linux-arm64`), which is in the reported
  # set, never the failing one. If the failing set ever widens past OS packages,
  # this decision has to be revisited with it.
  #
  # ─── Can this silently not run? ──────────────────────────────────────
  #
  # Three ways it could, and what catches each:
  #   1. An image pushed with no digest file — `if-no-files-found: error` on the
  #      upload above fails the build leg, which fails `build-and-push`, which
  #      `release` is gated on.
  #   2. Fewer digest files than images built — the count assertion below compares
  #      against `needs.build-and-push.outputs.image-count` (the matrix size).
  #   3. Trivy erroring and being read as "clean" — the failing arm runs with
  #      `--exit-code 2`, so findings (2) and tool errors (1) are distinguishable,
  #      and any other code aborts the job. The report arm runs under `set -e`
  #      with `--exit-code 0`, so a tool error there is a step failure too.
  scan-images:
    name: Scan published images
    needs: build-and-push
    runs-on: ubuntu-latest
    # MEASURED 2026-09-08: trivy 0.74.0 over all eight published 1.0.0-beta.57
    # images, sequentially, cold cache — 630s wall clock. Per image: 25, 13, 283,
    # 7, 5, 287, 7, 3 seconds. The two five-minute entries are `appstrate-sidecar`
    # and `appstrate-mcp-runner-bun`, and they are PULL time, not scan time: they
    # were the two whose `oven/bun` base layers were not already in the local
    # cache, over a domestic link. A GitHub runner pulling GHCR is not that link,
    # so treat 630s as a pessimistic ceiling rather than an estimate. 20 minutes
    # holds even at that pessimistic rate, with room for a cold advisory DB.
    timeout-minutes: 20
    permissions:
      # Narrower than the workflow-level block, which grants `contents: write`,
      # `packages: write` and `attestations: write` to every job that does not say
      # otherwise. This job reads the repo, pulls the images it scans, and writes
      # code-scanning alerts — nothing else.
      contents: read
      packages: read
      security-events: write
    steps:
      # upload-sarif resolves the commit it annotates from the checked-out repo;
      # `persist-credentials: false` mirrors scorecard.yml — nothing here pushes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pushed image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: refs
          # Safe to flatten: each artifact holds exactly one `<image>.ref`, and
          # the image names are unique by construction (they are GHCR repo names).
          merge-multiple: true

      # Trivy also reads `~/.docker/config.json` for its own advisory DB, which
      # lives at ghcr.io/aquasecurity/trivy-db — anonymous pulls of it are rate
      # limited per IP on shared runners. Logging in covers both the DB and the
      # images.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned release tarball + checksum rather than `aquasecurity/trivy-action`.
      # The action runs one scan per invocation and an action cannot be called in
      # a loop, so using it would mean re-listing the eight images as a matrix —
      # a THIRD copy of the block this file's own header warns about keeping in
      # lockstep. The version+digest pin gives the same "exactly these bytes"
      # property the SHA pins elsewhere give, and mirrors how security.yml
      # installs gitleaks.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          # sha256 of trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz, taken from that
          # release's own checksums.txt. Bump both lines together — a version bump
          # alone fails the `sha256sum -c` below, which is the intended behaviour.
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f trivy.tar.gz
          trivy --version

      - name: Scan every pushed image
        id: scan
        env:
          EXPECTED: ${{ needs.build-and-push.outputs.image-count }}
        run: |
          set -euo pipefail
          mkdir -p sarif
          : > fixable-critical.txt

          # Counted by globbing, not `ls | wc -l` (SC2012): an unmatched glob
          # stays literal, so the `-e` test is what makes "no artifacts at all"
          # count 0 instead of 1. Written as a full `if` rather than
          # `[ -e … ] && FOUND=…` because under `set -e` the short form exits the
          # script when the test is false — failing, but with no message.
          FOUND=0
          for ref_file in refs/*.ref; do
            if [ -e "$ref_file" ]; then
              FOUND=$((FOUND + 1))
            fi
          done
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED image digest(s) from build-and-push, found $FOUND."
            echo "::error::Every matrix leg uploads one 'image-digest-<name>' artifact holding"
            echo "::error::'<name>.ref'. A missing one means an image was published unscanned —"
            echo "::error::check the 'Record pushed digest' / 'Upload pushed digest' steps."
            exit 1
          fi

          for ref_file in refs/*.ref; do
            name="$(basename "$ref_file" .ref)"
            ref="$(cat "$ref_file")"
            echo "── $name → $ref"

            # Report arm. Every severity, fixed and unfixed. `--exit-code 0` means
            # findings do not stop the loop; a trivy ERROR still exits non-zero
            # and `set -e` fails the step, so a scan that did not happen cannot
            # look like a scan that found nothing.
            trivy image --quiet --scanners vuln \
              --format sarif --output "sarif/${name}.sarif" --exit-code 0 "$ref"
            if [ ! -s "sarif/${name}.sarif" ]; then
              echo "::error::Trivy produced no SARIF for $name ($ref)."
              exit 1
            fi
            # GitHub keys a code-scanning analysis on `runs[].automationDetails.id`
            # (the trailing slash is its "no further sub-category" convention), so
            # this is what keeps eight images from collapsing into one "Trivy"
            # analysis. Belt and braces if it collapses anyway: Trivy already
            # stamps `runs[].properties.imageName` + `repoDigests`, and every
            # result's `artifactLocation.uri` is the image repo path — verified
            # 2026-09-08 on real Trivy 0.74.0 SARIF output.
            jq --arg id "trivy-image/${name}/" \
              '.runs[].automationDetails = {id: $id}' \
              "sarif/${name}.sarif" > "sarif/${name}.sarif.tmp"
            mv "sarif/${name}.sarif.tmp" "sarif/${name}.sarif"

            # Failing arm — see the "Fail vs report" block above for why it is
            # `--pkg-types os` and CRITICAL-only. `--exit-code 2`, not 1, so
            # "found something" (2) is distinguishable from "trivy failed" (1):
            # with 1 the two are the same code, and a broken scanner then reads as
            # a vulnerable image — or, once someone "fixes" that by ignoring the
            # code, a vulnerable image reads as a broken scanner.
            rc=0
            trivy image --quiet --scanners vuln \
              --pkg-types os --severity CRITICAL --ignore-unfixed \
              --format table --exit-code 2 "$ref" || rc=$?
            case "$rc" in
              0) ;;
              2) echo "$name $ref" >> fixable-critical.txt ;;
              *)
                echo "::error::Trivy exited $rc scanning $ref — tool failure, not a finding."
                exit 1
                ;;
            esac
          done

          echo "Scanned $FOUND image(s); $(wc -l < fixable-critical.txt | tr -d ' ') with fixable CRITICAL findings."

      # Before the verdict step, and without `if: always()`: the report arm cannot
      # fail on findings, so reaching here means every image was scanned. Findings
      # must land in the Security tab whether or not they block the release.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          # A directory: codeql-action uploads every *.sarif in it as one
          # submission, one run per image, kept apart by the automationDetails id
          # stamped above.
          sarif_file: sarif

      - name: Block the release on fixable CRITICAL findings
        run: |
          set -euo pipefail
          if [ ! -f fixable-critical.txt ]; then
            echo "::error::fixable-critical.txt is missing — the scan step did not run to completion."
            exit 1
          fi
          if [ -s fixable-critical.txt ]; then
            echo "::error::CRITICAL OS-package vulnerabilities with an available fix, in images"
            echo "::error::this run already pushed to GHCR:"
            while read -r line; do echo "::error::  $line"; done < fixable-critical.txt
            echo "::error::The 'Scan every pushed image' step log lists the packages and their"
            echo "::error::fixed versions. Bump the base image in the Dockerfile named by the"
            echo "::error::matrix row, then cut a new tag — this workflow has no re-run path."
            echo "::error::Everything else Trivy found (HIGH/MEDIUM, unfixed, and the node/python"
            echo "::error::layer) is in the repo Security tab and does not block a release."
            exit 1
          fi
          echo "No CRITICAL OS-package findings with an available fix."

  # ─── CLI single-binary builds (per-target, native runners) ────────────────
  #
  # `bun build --compile --target=bun-<os>-<arch>` cross-compiles the JS
  # bundle + embeds a Bun runtime, but it does NOT cross-install N-API
  # native modules — `@napi-rs/keyring`'s platform-specific binding is
  # resolved at `bun install` time against the host's `process.platform`.
  # Preflight PF-1 confirmed that compiling for linux-x64 from macOS
  # produces a binary that fails at runtime with "Cannot find native
  # binding" on Linux. So each target must build on its own native
  # runner: macOS arm64 on `macos-14` (M1), macOS x64 on `macos-15-intel`
  # (last remaining Intel-macOS runner since GitHub retired macos-13),
  # Linux x64 on `ubuntu-latest`, Linux arm64 on `ubuntu-24.04-arm`
  # (GitHub's free ARM runner tier).
  #
  # Artifact asset names match the pattern `bootstrap.sh` downloads
  # (`appstrate-${OS}-${ARCH}`) — do NOT rename without also updating
  # `scripts/bootstrap.sh`.
  build-cli:
    needs: verify-version
    name: CLI binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: bun-darwin-arm64
            asset: appstrate-darwin-arm64
          # `macos-15-intel` is GitHub's last Intel-mac runner (macos-13
          # retired 2025-12). When it follows, drop the darwin-x64 row
          # and ship only darwin-arm64 — Intel Macs are a rounding error
          # on the CLI install curve by then. Tracked in ADR-006 (private docs repo).
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: appstrate-darwin-x64
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: appstrate-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: appstrate-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: bun install

      - name: Stamp release version into CLI package.json
        working-directory: apps/cli
        run: |
          # `lib/version.ts` imports `package.json` statically so
          # `bun build --compile` bakes whatever version is on disk at
          # build time. Repo default is `0.0.0` (dev). Overwrite with
          # the tag being released so the shipped binary reports the
          # matching semver on `appstrate --version`. jq is installed
          # on both ubuntu-latest and macos-14/macos-15-intel runner
          # images by default.
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          grep '"version"' package.json

      - name: Compile CLI binary
        working-directory: apps/cli
        run: |
          # `--define '__APPSTRATE_INSTALL_SOURCE__="curl"'` stamps the
          # binary as the curl-channel artefact at build time. See
          # `src/lib/install-source.ts` and issue #249. Source/dev builds
          # leave the identifier undefined and resolve to "unknown".
          bun build --compile \
            --target=${{ matrix.target }} \
            --define '__APPSTRATE_INSTALL_SOURCE__="curl"' \
            src/cli.ts \
            --outfile=${{ matrix.asset }}

      - name: Smoke-test binary (--help + --version) in clean dir
        working-directory: apps/cli
        run: |
          # MUST run from a directory with no sibling package.json — otherwise
          # bugs in transitive deps that resolve `dirname(process.execPath)/package.json`
          # at module top-level (e.g. `@earendil-works/pi-coding-agent`) are masked
          # by `apps/cli/package.json` and only crash on the user's machine.
          # See `apps/cli/src/lib/pi-binary-shim.ts` for the post-mortem.
          TMP="$(mktemp -d)"
          cp "./${{ matrix.asset }}" "$TMP/appstrate"
          "$TMP/appstrate" --help
          REPORTED=$("$TMP/appstrate" --version)
          rm -rf "$TMP"
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "Binary reports: $REPORTED / expected: $EXPECTED"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::Version mismatch — compiled binary reports '$REPORTED', tag is '$EXPECTED'."
            echo "::error::Check that the 'Stamp release version' step ran before 'Compile CLI binary'."
            exit 1
          fi

      # `--help` and `--version` do not exercise the `@napi-rs/keyring`
      # native module. A cross-compile misconfiguration or a future Bun
      # regression could ship a binary whose `require()` of the `.node`
      # has been silently replaced by a throw stub — it would pass the
      # checks above and crash the first time a user runs `login`. Build
      # and run a tiny probe against the same `--target` to force the
      # native binding to load.
      - name: Smoke-test keyring native binding
        working-directory: apps/cli
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            scripts/ci-keyring-probe.ts \
            --outfile=ci-keyring-probe
          ./ci-keyring-probe
          rm -f ci-keyring-probe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: apps/cli/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # ─── CLI supply-chain: minisign-signed checksums + SLSA provenance ────────
  #
  # Closes the trust chain from `get.appstrate.dev` down to the running
  # CLI binary. The published `bootstrap.sh` downloads the binary from
  # this release + the `checksums.txt` + `checksums.txt.minisig` produced
  # here, verifies the signature against `scripts/appstrate.pub` (shipped
  # alongside), and refuses to exec the binary unless its SHA-256
  # matches. Without this job the bootstrapper has no cryptographic
  # anchor and the whole curl | bash path degrades to TLS-only trust.
  sign-cli:
    name: Sign CLI binaries
    # Also `needs: build-runner-daemon` so the daemon binaries can be folded
    # into the SAME signed checksums.txt (see "Stage runner daemon binaries").
    # `if: always() && build-cli success` keeps the CLI signable even when the
    # decoupled 90-min daemon build flaked — the daemon-staging step below is
    # guarded so a CLI-only manifest is signed in that case.
    needs: [build-cli, build-runner-daemon]
    if: always() && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CLI + runner daemon binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # `docker/build-push-action` auto-uploads
          # `<name>~<name>~<id>.dockerbuild` summary artifacts to the
          # same run; without a pattern filter, download-artifact pulls
          # them too — and they're large enough to flake the 5-retry
          # blob download budget. Restrict to the binary asset names.
          # This pattern also matches the `appstrate-runner-*` daemon
          # artifacts (staged into the signed manifest below when present).
          pattern: appstrate-*
          path: cli-binaries
          merge-multiple: false

      - name: Stage CLI binaries
        id: stage
        run: |
          # Copy ONLY the four CLI binaries by exact name into out/ — an
          # explicit list, not `find -name appstrate-*`, so the daemon
          # artifacts (appstrate-runner-*, sharing the appstrate-* download
          # pattern) do NOT leak into the signed manifest here. The daemon
          # binaries are folded in deterministically by the next step.
          mkdir -p out
          for asset in appstrate-darwin-arm64 appstrate-darwin-x64 \
                       appstrate-linux-x64 appstrate-linux-arm64; do
            src="$(find cli-binaries -type f -name "$asset" | head -1)"
            if [ -z "$src" ]; then
              echo "::error::Missing CLI binary: $asset"
              exit 1
            fi
            cp "$src" "out/$asset"
          done
          ls -la out/

      - name: Stage runner daemon binaries into the signed manifest
        # Fold the daemon binaries into the SAME checksums.txt the CLI is signed
        # under, so `appstrate runner install` verifies the daemon against a
        # minisign-signed digest instead of a bare same-origin .sha256 sidecar
        # (a trust downgrade). Guarded on the daemon job: the release is
        # decoupled from it, so when it failed we sign a CLI-only manifest and
        # the daemon simply isn't part of this release.
        if: needs.build-runner-daemon.result == 'success'
        run: |
          for asset in appstrate-runner-x86_64 appstrate-runner-aarch64; do
            src="$(find cli-binaries -type f -name "$asset" | head -1)"
            if [ -z "$src" ]; then
              echo "::error::Missing runner daemon binary: $asset"
              exit 1
            fi
            cp "$src" "out/$asset"
          done
          ls -la out/

      - name: Generate checksums
        run: |
          cd out
          # `shasum -a 256` output format matches what `sha256sum -c`
          # expects, so `bootstrap.sh` can verify with either tool. out/
          # holds only binaries (no .sha256 sidecars), so the glob is clean.
          sha256sum appstrate-* > checksums.txt
          cat checksums.txt

      - name: Sign checksums with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Secrets are required: we intentionally fail rather than ship
          # a release with unsigned binaries. Mixed signed/unsigned
          # releases would force `bootstrap.sh` to tolerate missing
          # signatures, which defeats the whole verification flow.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY + MINISIGN_PASSWORD secrets must be set."
            echo "::error::Generate a keypair with 'minisign -G -p appstrate.pub -s appstrate.key',"
            echo "::error::store the private key + password as the two repo secrets above, and"
            echo "::error::commit the new public key to scripts/appstrate.pub in the SAME release."
            echo "::error::Rotating without shipping the matching pubkey breaks bootstrap.sh verification."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            minisign -S -s /tmp/minisign.key \
              -t "appstrate CLI $VERSION" \
              -m out/checksums.txt
          rm -f /tmp/minisign.key
          # Ship the public key next to the signed checksums so air-gapped
          # users and second-party mirrors have everything they need in
          # one place. `scripts/appstrate.pub` is the source of truth;
          # copying to `out/` just avoids a second checkout on the
          # consumer side.
          cp scripts/appstrate.pub out/appstrate.pub

      - name: Attest CLI binary provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/appstrate-*

      - name: Upload signed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-signed-bundle
          path: |
            out/checksums.txt
            out/checksums.txt.minisig
            out/appstrate.pub
          if-no-files-found: error
          retention-days: 7

  # ─── Firecracker guest artifacts (prebuilt kernel + rootfs) ───────────────
  #
  # Publishes versioned, checksum-verified guest artifacts so the
  # `appstrate-runner` daemon (issue #819, phase 2) downloads them at boot
  # instead of requiring an on-host `bun run firecracker:build` (docker +
  # sudo + a full checkout, ~10 min / ~1.3 GB per host).
  #
  # Built natively per arch (no QEMU): x86_64 on ubuntu-latest, aarch64 on
  # ubuntu-24.04-arm (GitHub's free ARM runner). Both scripts run their
  # heavy lifting inside Docker (build-kernel.sh) / via docker build
  # (build-rootfs.sh), so the runner only needs docker + e2fsprogs + zstd.
  #
  # Each arch uploads three workflow artifacts consumed by the `release`
  # job: the kernel, the zstd-compressed rootfs, and a manifest fragment
  # (`{ "<arch>": { vmlinux, rootfs } }`) that `release` merges into the
  # single `firecracker-artifacts-manifest.json`. The resolver verifies the
  # DECOMPRESSED rootfs sha256 against the manifest, so `rootfs.sha256` is
  # the digest of the ext4 image and `rootfs.compressed_size` is the `.zst`.
  # The merged manifest is Ed25519-signed in the `release` job (detached
  # `firecracker-artifacts-manifest.json.sig` asset) — the daemon verifies
  # that signature against a source-pinned public key BEFORE trusting any
  # hash inside the manifest (P1-4, runner/artifacts.ts).
  firecracker-artifacts:
    needs: verify-version
    name: Firecracker guest artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install e2fsprogs + zstd
        run: |
          sudo apt-get update -qq
          # e2fsprogs (mkfs.ext4/debugfs) is usually preinstalled; zstd is
          # required to compress the rootfs asset. Install both to be safe.
          sudo apt-get install -y -qq e2fsprogs zstd

      - name: Build guest kernel
        run: bash apps/api/src/modules/firecracker/scripts/build-kernel.sh ./data/firecracker/vmlinux

      - name: Build guest rootfs
        run: bash apps/api/src/modules/firecracker/scripts/build-rootfs.sh ./data/firecracker/rootfs.ext4

      - name: Compress rootfs + compute checksums
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          # Kernel ships uncompressed; rootfs ships zstd-compressed. `-19 -T0`
          # trades CI time for a smaller asset (the download runs once per host).
          cp ./data/firecracker/vmlinux "vmlinux-${ARCH}"
          zstd -19 -T0 -f -o "rootfs-${ARCH}.ext4.zst" ./data/firecracker/rootfs.ext4

          VMLINUX_SIZE=$(stat -c%s "vmlinux-${ARCH}")
          VMLINUX_SHA=$(sha256sum "vmlinux-${ARCH}" | cut -d' ' -f1)
          # Manifest sha256 = digest of the DECOMPRESSED ext4 (what the daemon
          # verifies after zstd decompression); compressed_size = the .zst asset.
          ROOTFS_SIZE=$(stat -c%s ./data/firecracker/rootfs.ext4)
          ROOTFS_SHA=$(sha256sum ./data/firecracker/rootfs.ext4 | cut -d' ' -f1)
          ROOTFS_CSIZE=$(stat -c%s "rootfs-${ARCH}.ext4.zst")

          jq -n \
            --arg arch "$ARCH" \
            --arg vsha "$VMLINUX_SHA" --argjson vsize "$VMLINUX_SIZE" \
            --arg rsha "$ROOTFS_SHA" --argjson rsize "$ROOTFS_SIZE" --argjson rcsize "$ROOTFS_CSIZE" \
            '{($arch): {vmlinux: {sha256: $vsha, size: $vsize}, rootfs: {sha256: $rsha, size: $rsize, compressed_size: $rcsize}}}' \
            > "fragment-${ARCH}.json"
          cat "fragment-${ARCH}.json"

      - name: Upload guest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firecracker-${{ matrix.arch }}
          path: |
            vmlinux-${{ matrix.arch }}
            rootfs-${{ matrix.arch }}.ext4.zst
            fragment-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  # ─── Runner daemon binary (compiled appstrate-runner) ────────────────────
  #
  # `appstrate runner install` (issue #819, phase 3) downloads THIS compiled
  # binary onto a bare KVM host — no checkout, no bun, no on-host build. It is
  # deliberately SEPARATE from the CLI: zero firecracker code ships in the CLI,
  # zero CLI code ships in the daemon.
  #
  # `bun build --compile` embeds a Bun runtime + the daemon's JS closure. The
  # daemon has no N-API native modules (unlike the CLI's keyring), so a plain
  # cross-compile would suffice — but we build each arch on its OWN native
  # runner so the smoke step below can actually EXECUTE the binary and prove
  # the compile + env-decoupling on the target arch. x86_64 on ubuntu-latest,
  # aarch64 on ubuntu-24.04-arm (GitHub's free ARM tier), mirroring the
  # firecracker-artifacts matrix.
  #
  # Asset names (`appstrate-runner-<arch>`) match `daemonAssetName()` in
  # apps/cli/src/lib/runner/constants.ts — do NOT rename without updating it.
  build-runner-daemon:
    needs: verify-version
    name: Runner daemon (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: bun-linux-x64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: bun install

      # Shared bake step (scripts/bake-firecracker-pubkey.sh, also called by
      # `build-and-push`): replace the `__FIRECRACKER_ARTIFACTS_ED25519_PUBKEY__`
      # placeholder with the real public key BEFORE the compile below embeds
      # runner/artifacts.ts into the daemon binary. This is the primary consumer
      # of the pinned key — the compiled daemon verifies every downloaded
      # manifest against it. Fail-closed (mirrors the minisign guard in
      # sign-cli): shipping a daemon that still carries the placeholder means
      # every boot dies with FatalArtifactsError "signing key is not provisioned".
      - name: Bake Firecracker manifest signing pubkey
        env:
          FIRECRACKER_MANIFEST_SIGNING_KEY: ${{ secrets.FIRECRACKER_MANIFEST_SIGNING_KEY }}
        run: bash scripts/bake-firecracker-pubkey.sh

      - name: Compile runner daemon binary
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            apps/api/src/modules/firecracker/runner/daemon.ts \
            --outfile=appstrate-runner-${{ matrix.arch }}

      # Boot the compiled binary with ONLY the FIRECRACKER_RUNNER_* variables
      # (+ FIRECRACKER_ARTIFACTS_LOCAL=1 to skip the network download) and
      # assert it reaches the HOST PREFLIGHT error inside orchestrator
      # initialize() — /dev/kvm and the kernel/rootfs are absent on a GitHub
      # runner, so initialize() must fail. This proves two things at once:
      #   1. `bun build --compile` produced a runnable binary (it started).
      #   2. The daemon booted WITHOUT the platform env schema — no
      #      BETTER_AUTH_SECRET / CONNECTION_ENCRYPTION_KEY / @appstrate/env.
      #      A regression that re-coupled the closure to @appstrate/env would
      #      crash at env-parse BEFORE preflight, which this step catches.
      - name: Smoke-test compiled binary (env-decoupled preflight)
        run: |
          set +e
          OUT=$(env -i \
            PATH="$PATH" \
            FIRECRACKER_RUNNER_TOKEN=0123456789abcdef0123456789abcdef \
            FIRECRACKER_RUNNER_PLATFORM_URL=http://10.0.0.1:3000 \
            FIRECRACKER_ARTIFACTS_LOCAL=1 \
            ./appstrate-runner-${{ matrix.arch }} 2>&1)
          CODE=$?
          echo "--- daemon output ---"
          echo "$OUT"
          echo "--- exit code: $CODE ---"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::Daemon exited 0 — expected a host-preflight failure on a non-KVM runner."
            exit 1
          fi
          # Must reach the orchestrator's host preflight (KVM / kernel / rootfs).
          if ! echo "$OUT" | grep -qiE "orchestrator initialize|prerequisites missing|/dev/kvm|requires a Linux host with KVM"; then
            echo "::error::Daemon did not reach the KVM/Linux host preflight — compile or boot-order regression."
            exit 1
          fi
          # Must NOT fail on the platform env schema — that would mean the
          # daemon closure re-coupled to @appstrate/env (env-decoupling broke).
          if echo "$OUT" | grep -qE "BETTER_AUTH_SECRET|CONNECTION_ENCRYPTION_KEY|UPLOAD_SIGNING_SECRET|RUN_TOKEN_SECRET|CONNECT_SESSION_SECRET"; then
            echo "::error::Daemon required a platform env var — env decoupling regressed."
            exit 1
          fi
          echo "Runner daemon smoke passed: compiled, env-decoupled, reached host preflight."

      - name: Upload runner daemon binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstrate-runner-${{ matrix.arch }}
          # No same-origin `.sha256` sidecar: the daemon binary is verified
          # exclusively against the minisign-signed `checksums.txt` (folded in
          # by the sign-cli job, downloaded by `appstrate runner install`).
          path: appstrate-runner-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    # The CORE release (GH Release + CLI binaries + signed checksums) must not
    # be hard-blocked by the firecracker guest-artifact / runner-daemon builds:
    # `firecracker-artifacts` is a ~90-min kernel+rootfs build (incl.
    # ubuntu-24.04-arm) and a single flake would otherwise sink every release.
    # So depend on them for ordering but gate only on the core jobs, and upload
    # the firecracker/daemon assets conditionally (per-step `if` on their
    # results). A release published without runner assets is handled on the
    # consumer side: `appstrate runner install` gives an actionable 404 error
    # (apps/cli/src/lib/runner/download.ts) pointing at a version that has them.
    #
    # `scan-images` IS a hard gate, unlike those two: the images are already in
    # GHCR by the time it runs, so refusing to publish the GH Release is the only
    # lever left on a release carrying a fixable critical. It is cheap (~3 min)
    # and it is decided by this repo's own inputs, not by a third party's build.
    needs:
      [build-and-push, scan-images, build-cli, sign-cli, firecracker-artifacts, build-runner-daemon]
    if: >-
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.scan-images.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.sign-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Same filter as the sign job — skip the docker-buildx summary
          # artifacts that share the run.
          pattern: appstrate-*
          path: cli-binaries
          # Each artifact is extracted into its own subdir under `path`;
          # flatten by globbing in the release step below.
          merge-multiple: false

      - name: Download signed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-signed-bundle
          path: cli-signed

      - name: Download Firecracker guest artifacts
        # Decoupled build (may have failed) — skip cleanly and the manifest +
        # asset uploads below are guarded on the same condition.
        if: needs.firecracker-artifacts.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One artifact per arch (firecracker-x86_64, firecracker-aarch64),
          # each extracted into its own subdir under `path`.
          pattern: firecracker-*
          path: firecracker-assets
          merge-multiple: false

      - name: Download runner daemon binaries
        # Decoupled build (may have failed) — skip cleanly; the release simply
        # ships without daemon assets for this tag.
        if: needs.build-runner-daemon.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # One artifact per arch (appstrate-runner-x86_64,
          # appstrate-runner-aarch64), each holding just the daemon binary
          # (verified against the signed checksums.txt, no .sha256 sidecar).
          pattern: appstrate-runner-*
          path: runner-daemon
          merge-multiple: false

      - name: Assemble Firecracker manifest
        # Only when the guest artifacts were built + downloaded above.
        if: needs.firecracker-artifacts.result == 'success'
        run: |
          set -euo pipefail
          # guest_protocol is the single source of truth in the daemon source
          # — read it here so the manifest can never drift from the resolver.
          # `|| true` + explicit check so a moved/renamed constant fails with a
          # clear message instead of a bare pipefail grep exit.
          GUEST_PROTOCOL=$(grep -oP 'GUEST_PROTOCOL_VERSION = \K[0-9]+' \
            apps/api/src/modules/firecracker/runner/artifacts.ts || true)
          if [ -z "$GUEST_PROTOCOL" ]; then
            echo "::error::Could not parse GUEST_PROTOCOL_VERSION from runner/artifacts.ts — the source constant was moved or its shape changed. The firecracker manifest cannot be assembled without it; update this grep."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # Merge the per-arch fragments ({ "<arch>": {...} }) into the
          # combined manifest wrapped with version + guest_protocol.
          jq -s \
            --arg v "$VERSION" \
            --argjson gp "$GUEST_PROTOCOL" \
            '{version: $v, guest_protocol: $gp, artifacts: add}' \
            firecracker-assets/*/fragment-*.json \
            > firecracker-artifacts-manifest.json
          cat firecracker-artifacts-manifest.json

      - name: Setup Bun (Firecracker manifest signing)
        if: needs.firecracker-artifacts.result == 'success'
        uses: ./.github/actions/bun-setup

      - name: Sign Firecracker manifest
        # The manifest is the ROOT OF TRUST for the guest kernel/rootfs hashes
        # — the daemon verifies its detached Ed25519 signature against the
        # source-pinned public key (baked over the placeholder by the
        # `Bake Firecracker manifest signing pubkey` steps, same secret)
        # BEFORE trusting any hash inside it. Signature format: base64 raw
        # 64-byte Ed25519 over the exact manifest bytes, one line
        # (runner/artifacts.ts verifyManifestSignature).
        if: needs.firecracker-artifacts.result == 'success'
        env:
          FIRECRACKER_MANIFEST_SIGNING_KEY: ${{ secrets.FIRECRACKER_MANIFEST_SIGNING_KEY }}
        run: |
          # Fail-closed, mirroring the minisign guard in sign-cli: the daemon
          # HARD-FAILS on a release that publishes a manifest without its
          # `.sig` asset (fetchManifestSignature → FatalArtifactsError), so
          # publishing unsigned would brick `runner install` for this tag —
          # worse than a failed release.
          if [ -z "${FIRECRACKER_MANIFEST_SIGNING_KEY:-}" ]; then
            echo "::error::FIRECRACKER_MANIFEST_SIGNING_KEY secret must be set — refusing to publish an unsigned Firecracker artifacts manifest."
            echo "::error::Generate a keypair with: bun scripts/sign-firecracker-manifest.ts --generate"
            exit 1
          fi
          # Signs + self-verifies with the derived public key (the exact check
          # the daemon performs), writing firecracker-artifacts-manifest.json.sig.
          bun scripts/sign-firecracker-manifest.ts firecracker-artifacts-manifest.json

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            echo "## What's Changed" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$NOTES" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Docker Images" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo '```sh' >> "$GITHUB_OUTPUT"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/appstrate:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/appstrate-pi:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/appstrate-sidecar:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "## Install the CLI" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo '```sh' >> "$GITHUB_OUTPUT"
            echo "curl -fsSL https://get.appstrate.dev | bash" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.notes.outputs.body }}
          # `fail_on_unmatched_files: false` (the default, pinned explicit for
          # intent): the firecracker/runner-daemon globs match nothing when
          # those decoupled jobs failed and their downloads were skipped — the
          # release must still publish the CLI + signed checksums for this tag.
          fail_on_unmatched_files: false
          # Flatten the per-artifact subdirs into a single glob so every
          # CLI binary lands as a top-level asset on the release, then
          # append the signed checksum bundle so `bootstrap.sh` can
          # verify integrity + provenance before chmod+x on a fresh host.
          files: |
            cli-binaries/*/appstrate-*
            cli-signed/checksums.txt
            cli-signed/checksums.txt.minisig
            cli-signed/appstrate.pub
            firecracker-assets/*/vmlinux-*
            firecracker-assets/*/rootfs-*.ext4.zst
            firecracker-artifacts-manifest.json
            firecracker-artifacts-manifest.json.sig
            runner-daemon/*/appstrate-runner-*
