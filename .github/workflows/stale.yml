name: Stale

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 60
          days-before-close: 14
          # Only labels that actually EXIST on the repo can exempt anything —
          # `gh label list` is the source of truth. The previous value listed
          # `pinned`, `roadmap` and `work-in-progress`, none of which exist, so
          # three quarters of the exemption policy was inert. Create the label
          # first, then add it here.
          exempt-issue-labels: "security,conformance,help wanted,good first issue"
          exempt-pr-labels: "security,conformance,dependencies,automated"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity for 60 days. It will be closed in 14 days if no
            further activity occurs. If this issue is still relevant, please leave
            a comment or remove the stale label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had recent activity for 60 days. It will be closed in 14 days if no
            further activity occurs. If this PR is still relevant, please leave a
            comment or remove the stale label.
