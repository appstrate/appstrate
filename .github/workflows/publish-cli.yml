name: Publish appstrate CLI to npm

# The CLI keeps `version: "0.0.0"` in the repo as a dev-build sentinel
# (see `apps/cli/src/lib/version.ts::DEV_CLI_VERSION`). This workflow
# rewrites `package.json` from the tag immediately before publishing so
# a released tarball carries the real version, while source checkouts
# keep tripping the dev guard that refuses to pull untagged GHCR images.

on:
  push:
    tags:
      - "cli@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (manual dispatch only, e.g. 1.0.0-alpha.53)"
        required: true

permissions:
  contents: write
  id-token: write

# Serialize ALL CLI publishes — `npm publish` updates the `latest`
# dist-tag on every non-prerelease publish. Two tags pushed in rapid
# succession (cli@1.0.0 then cli@1.0.1) would race: if 1.0.0 finishes
# last, `latest` points back to the older version. `cancel-in-progress:
# false` because a cancelled publish mid-flight leaves the registry
# inconsistent (provenance attestation orphaned, etc).
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Quality, Tests & Publish
    runs-on: ubuntu-latest
    # 20m caps the worst case: ~3m of install + tsc + tests + pack +
    # smoke + publish, up to 12m waiting for the version on the registry
    # (its own budget, which fails first with a clear error), then the
    # bunx smoke + GH Release, plus slack. A hang past 20m means npm/CDN
    # is wedged — fail loud rather than burn the GH Actions minutes
    # quota until the 6h hard ceiling.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # NO `registry-url`. It makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc,
          # and npm then tries to authenticate with that value instead of
          # falling back to OIDC. With NODE_AUTH_TOKEN unset the line resolves
          # to an EMPTY token, which is worse than no line at all: npm sends it
          # and the publish fails as unauthenticated rather than exchanging its
          # OIDC id-token. registry.npmjs.org is already the default registry,
          # so nothing is lost by dropping the input.

      # Trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Without this the publish fails with a confusing auth error rather
      # than a version complaint.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install
        working-directory: .

      - name: TypeScript type-check
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Resolve publish version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#cli@}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve publish version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # `npm pack` names the tarball `<package>-<version>.tgz` deterministically;
          # naming it once here is safer than globbing (shellcheck SC2012).
          echo "tarball=appstrate-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Write tag version into package.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Publishing appstrate@$VERSION"
          jq '.version' package.json

      - name: Pre-publish smoke test (pack + install + run locally)
        # Build THE tarball that gets published: `npm pack` runs `prepack` →
        # `bun run build` with APPSTRATE_INSTALL_SOURCE=bun, which stamps the
        # bundle as the npm-channel artefact (see `src/lib/install-source.ts`,
        # issue #249). Install it into a throwaway directory and ask the bin
        # for its stamp: `source` must be `bun` and `version` the tag, so a
        # missing stamp or a stale version fails here, BEFORE the registry is
        # touched — unlike a post-publish failure, recoverable without
        # `npm deprecate`. The tarball is kept: it is the publish input.
        env:
          APPSTRATE_INSTALL_SOURCE: bun
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: |
          npm pack
          if ! tar -xOzf "$TARBALL" package/package.json | jq -e '.bin.appstrate' >/dev/null; then
            echo "::error::$TARBALL has no bin.appstrate in its package.json"
            exit 1
          fi
          WORK="$(mktemp -d)"
          (cd "$WORK" && npm init -y >/dev/null && npm install "${GITHUB_WORKSPACE}/apps/cli/$TARBALL")
          INFO="$("$WORK/node_modules/.bin/appstrate" __install-source)"
          rm -rf "$WORK"
          if ! jq -e --arg v "$VERSION" '.source == "bun" and .version == $v' <<<"$INFO" >/dev/null; then
            echo "::error::Packed CLI reports $INFO, expected source \"bun\" and version \"$VERSION\""
            exit 1
          fi

      - name: Publish to npm
        id: publish
        # Publishes the tarball validated above, not the source directory: a
        # tarball publish runs no lifecycle scripts, so `prepack` cannot rebuild
        # the bundle without APPSTRATE_INSTALL_SOURCE (which shipped the
        # `unknown` stamp up to beta.61), and npm reads the manifest from the
        # tarball instead of validating the source one before any build.
        # Tested artefact == shipped artefact.
        #
        # Unscoped packages are public by default — no `--access public` needed.
        #
        # Authentication is OIDC trusted publishing, NOT a token. `appstrate`
        # is an unscoped package, so it is owned by a personal account (npm
        # only lets organizations own scoped packages), and that account runs
        # 2FA in `auth-and-writes` mode — under which npm refuses every
        # token-based write with `403 You may not perform that action with
        # these credentials`. Granular and automation tokens both hit it; the
        # package sat stuck on 1.0.0-beta.14 from 2026-05-16 for that reason.
        # `@appstrate/core` is unaffected because it is org-owned, which is why
        # the same NPM_TOKEN kept publishing core throughout.
        #
        # OIDC sidesteps 2FA by design: the identity is the workflow, not a
        # person. It requires `id-token: write` (declared above) and a Trusted
        # Publisher registered on npmjs.com for this package, pinned to THIS
        # workflow filename — renaming this file breaks publishing until the
        # npm-side configuration is updated to match.
        #
        # `--tag latest` is required, not optional: npm >= 11 refuses to
        # publish a prerelease version without an explicit `--tag`, where
        # npm 10 silently assigned `latest`. That silent assignment is how
        # `latest` came to point at 1.0.0-beta.14, and it is the behaviour
        # consumers depend on — `npx appstrate` resolves the `latest`
        # dist-tag, so publishing under `beta` instead would leave every
        # npm-channel user pinned to beta.14 while the tarball for the new
        # version sat unreachable. Every release on this line is a
        # `1.0.0-beta.X`, so `latest` IS the release channel. Revisit only
        # when a stable line ships alongside prereleases and the two need
        # separate tags.
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --tag latest

      - name: Wait for the version on the npm registry
        # `npm publish` returns before consumers can resolve the version. For
        # 1.0.0-beta.61 the abbreviated packument bun resolves against changed
        # ~4 min after publish, and the CDN caches it for 300 s: ~10 min worst
        # case. Retrying bunx is the wrong loop: in run 35872274810 each of its
        # 6 attempts failed within ~35 ms, i.e. likely without a fresh registry
        # read. So poll what bun sees (same URL and Accept header, no cache
        # buster) for up to 12 min, the worst case plus slack; a curl error
        # counts as "not yet".
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WAIT_MINUTES: 12
          POLL_SECONDS: 15
        run: |
          PACKUMENT_URL="https://registry.npmjs.org/appstrate"
          polls=0
          until curl -fsS -H "Accept: application/vnd.npm.install-v1+json" "$PACKUMENT_URL" \
            | jq -e --arg v "$VERSION" '.versions[$v]' >/dev/null; do
            if [ "$SECONDS" -ge $((WAIT_MINUTES * 60)) ]; then
              echo "::error::npm publish succeeded, but appstrate@$VERSION was still not visible in the registry packument after $WAIT_MINUTES minutes. Do NOT republish or re-run this job (npm refuses an existing version): once the version appears, check it with 'bunx appstrate@$VERSION __install-source'."
              exit 1
            fi
            polls=$((polls + 1))
            if [ $((polls % 4)) -eq 0 ]; then
              echo "appstrate@$VERSION not visible yet (${SECONDS}s elapsed)"
            fi
            sleep "$POLL_SECONDS"
          done
          echo "appstrate@$VERSION visible after ${SECONDS}s"

      - name: Post-publish smoke test (registry → bunx)
        # Runs what users download, once: catches wrong registry metadata (bin
        # dropped, etc.) or a wrong stamp that the tarball check above cannot.
        # A fresh BUN_INSTALL_CACHE_DIR so no manifest cached earlier in the job
        # can answer for the registry. Same assertion as the pre-publish smoke.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          INFO="$(BUN_INSTALL_CACHE_DIR="$(mktemp -d)" bunx -y "appstrate@$VERSION" __install-source)"
          if ! jq -e --arg v "$VERSION" '.source == "bun" and .version == $v' <<<"$INFO" >/dev/null; then
            echo "::error::Published CLI reports $INFO, expected source \"bun\" and version \"$VERSION\""
            exit 1
          fi

      - name: Create GitHub Release
        # Runs whenever `npm publish` succeeded, even if the wait/smoke above
        # failed: the npm version is immutable once published, so its tag gets
        # its release regardless (#1518).
        if: github.event_name == 'push' && !cancelled() && steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # Never GitHub's "latest". `appstrate self-update`, `bootstrap.sh`
          # and `bootstrap-runner.sh` resolve "latest" by LISTING the Releases
          # API and taking the newest platform `v<semver>` tag — they no longer
          # follow `releases/latest`, precisely because every non-`v*` release
          # published before this line became "latest" until the next `v*` tag
          # and broke all three (cli@1.0.0-beta.56:
          # `vcli@1.0.0-beta.56/checksums.txt.minisig` → 404).
          #
          # The flag still matters, so do NOT drop it: "latest" remains visible
          # wherever nothing lists — the residual `releases/latest/download`
          # redirect the firecracker guest-artifact resolver still uses when
          # `FIRECRACKER_ARTIFACTS_VERSION` is unset
          # (`apps/api/src/modules/firecracker/runner/artifacts.ts`), and the
          # GitHub UI / repo sidebar, where an npm tag would be shown to humans
          # as the project's current release.
          make_latest: false
