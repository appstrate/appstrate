name: Preview Images

# Official preview channel (issue #819, phase 6). Builds the full 8-image
# stack from a PR (or an arbitrary ref) and publishes it to GHCR under a
# `pr-<n>` / `preview-<ref-slug>` tag so a reviewer can deploy the change on
# Coolify BEFORE merge — no CLI binaries, no GH Release, no `latest`.
#
# Opt-in per PR: add the `preview` label. A labeled PR re-publishes on every
# push. `workflow_dispatch` builds any ref on demand. amd64 only (the staging
# server is x86_64). See docs/deployment/PREVIEW_DEPLOY.md.
#
# A push to `main` publishes the same stack under `main` and then calls the
# staging deploy hook. See docs/deployment/STAGING.md.
#
# A tag is never moved one image at a time. Each image is pushed under
# `<tag>-<sha>` only, and `promote` points `<tag>` at all 8 once the last one is
# up: the platform, `PI_IMAGE` and `SIDECAR_IMAGE` are one version contract
# (AGENTS.md), and a tag half-moved by a failed or superseded build is a trio
# that disagrees.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build a preview from"
        required: true
        type: string
  pull_request:
    types: [labeled, synchronize]

concurrency:
  # One in-flight build per PR / dispatch ref / branch — a new push cancels the
  # stale one. On `main` that is what keeps staging on the newest commit: a
  # merge landing mid-build supersedes the run it interrupts, deploy included.
  group: preview-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # Gate on the `preview` label (pull_request) and resolve the tag + the ref
  # to check out. Skipping here keeps every unlabeled PR push a zero-cost no-op.
  resolve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'preview'))
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      checkout_ref: ${{ steps.compute.outputs.checkout_ref }}
      is_pr: ${{ steps.compute.outputs.is_pr }}
    steps:
      - name: Compute preview tag + checkout ref
        id: compute
        env:
          # Pass the user-controlled dispatch input through the environment
          # rather than inlining `${{ github.event.inputs.ref }}` in the script:
          # a crafted ref (e.g. containing `$(...)` / backticks) inlined into a
          # run: block is a shell-injection vector. Referenced as "$REF" below.
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            # Build the PR's HEAD, not the synthetic merge commit.
            echo "checkout_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          else
            # Slugify for a valid, readable Docker tag.
            SLUG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g' | cut -c1-100)"
            echo "tag=preview-${SLUG}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${REF}" >> "$GITHUB_OUTPUT"
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # ⚠️  DUPLICATED MATRIX — keep in lockstep with the identical `include:`
        # block in .github/workflows/release.yml (which additionally bakes the
        # Firecracker pubkey, builds multi-arch, and attests provenance).
        # Adding or renaming an image here means editing release.yml too.
        include:
          - name: appstrate
            context: .
            dockerfile: Dockerfile
          - name: appstrate-pi
            context: .
            dockerfile: ./runtime-pi/Dockerfile
          - name: appstrate-sidecar
            context: .
            dockerfile: ./runtime-pi/sidecar/Dockerfile
          - name: appstrate-mcp-runner-node
            context: ./runtime-pi/runners/node
            dockerfile: ./runtime-pi/runners/node/Dockerfile
          - name: appstrate-mcp-runner-python
            context: ./runtime-pi/runners/python
            dockerfile: ./runtime-pi/runners/python/Dockerfile
          - name: appstrate-mcp-runner-bun
            context: ./runtime-pi/runners/bun
            dockerfile: ./runtime-pi/runners/bun/Dockerfile
          - name: appstrate-mcp-runner-uv
            context: ./runtime-pi/runners/uv
            dockerfile: ./runtime-pi/runners/uv/Dockerfile
          - name: appstrate-mcp-runner-binary
            context: ./runtime-pi/runners/binary
            dockerfile: ./runtime-pi/runners/binary/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}

      # The commit actually built. `github.sha` is not it for a PR (the
      # synthetic merge commit) nor for a dispatch (the default branch's HEAD).
      - name: Resolve built commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only: preview images exist solely to deploy on the (x86_64)
          # staging/prod server — skipping arm64 roughly halves build time.
          platforms: linux/amd64
          push: true
          # Unlike release.yml, this job has no metadata-action `labels:` input,
          # so runtime-pi + sidecar get their OCI labels from these ARGs. The
          # platform compares the two `org.opencontainers.image.revision` labels
          # and warns on a pair built from different commits (#1200); unstamped
          # preview images read `unknown` on both sides and disable that check
          # silently. APP_VERSION + GIT_SHA are the platform image's own stamp,
          # what `/health` and the SPA footer report. Images declaring no such
          # ARG ignore them.
          build-args: |
            BUILD_VERSION=${{ needs.resolve.outputs.tag }}
            BUILD_REVISION=${{ steps.commit.outputs.sha }}
            APP_VERSION=${{ needs.resolve.outputs.tag }}
            GIT_SHA=${{ steps.commit.outputs.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ needs.resolve.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Point `<tag>` at the 8 images this run built. A registry-side retag: no
  # layer is pulled or pushed. The image list is read off the build matrix above
  # rather than restated.
  promote:
    needs: [resolve, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the tag
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          yq '.jobs.build-and-push.strategy.matrix.include[].name' .github/workflows/preview.yml |
            while read -r name; do
              docker buildx imagetools create \
                --tag "ghcr.io/$OWNER/$name:$TAG" \
                "ghcr.io/$OWNER/$name:$TAG-${{ github.sha }}"
            done

  # Continuous deployment of `main` to staging: call the deploy hook, then read
  # the commit back off the running platform. The hook is whatever the hosting
  # platform exposes to redeploy a stack that tracks the `main` tag; this job
  # knows its URL and its bearer token, and nothing else about it.
  #
  # The `staging` environment holds both and is restricted to the `main` branch,
  # so a PR editing this file cannot read the token.
  deploy-staging:
    needs: promote
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions: {}
    env:
      # The two origins are secrets so that Actions masks them: this
      # repository's logs are public, and a curl error names its host.
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - name: Call the deploy hook
        run: |
          set -euo pipefail
          : "${DEPLOY_HOOK_URL:?}" "${DEPLOY_HOOK_TOKEN:?}"
          curl --fail-with-body --silent --show-error --request POST "$DEPLOY_HOOK_URL" \
            --header "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
            --output /dev/null

      # The hook answering is the platform accepting a deployment, not the
      # deployment succeeding. A stack whose migrations fail never starts the
      # new build, so the commit never shows up here and the job fails.
      - name: Verify the running commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${STAGING_URL:?}"
          for _ in $(seq 1 120); do
            # --fail: a 503 body carries the version too, while the platform is
            # still starting or unhealthy.
            RUNNING="$(curl --fail --silent --max-time 10 "$STAGING_URL/health" | jq -r '.version.commit // empty' || true)"
            if [ -n "$RUNNING" ] && [ "${EXPECTED#"$RUNNING"}" != "$EXPECTED" ]; then
              echo "Staging runs $RUNNING"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging reports commit '${RUNNING:-none}' after 20 minutes, expected ${EXPECTED}"
          exit 1

  # Sticky PR comment with the tag + the one-liner to deploy on Coolify. Runs
  # only for PR events (a dispatch has no PR to comment on) and only after the
  # images are actually pushed.
  comment:
    needs: [resolve, promote]
    if: needs.resolve.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Upsert preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = ${{ toJSON(needs.resolve.outputs.tag) }};
            const marker = "<!-- appstrate-preview -->";
            const body = [
              marker,
              `### 🚀 Preview images published`,
              ``,
              `Tag: \`${tag}\` — 8 images on \`ghcr.io/${context.repo.owner}/appstrate*\` (amd64).`,
              ``,
              `**Deploy on Coolify:** set \`APPSTRATE_VERSION=${tag}\` and redeploy.`,
              ``,
              `> On a slow link, pre-pull the images on the host first ` +
              `(\`docker compose pull\`) — Coolify's deploy task times out at ` +
              `10 min and a cold GHCR pull of all 8 images can exceed that.`,
              ``,
              `See [docs/deployment/PREVIEW_DEPLOY.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/deployment/PREVIEW_DEPLOY.md).`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
