name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    # The suite runs as three slices on three runners — `scripts/run-tests.ts
    # --partition` deals the file list by file size, so every runner computes
    # the same three slices and together they cover it exactly once. Tier 3
    # shares one PostgreSQL/Redis/MinIO/DinD per runner, so a runner cannot
    # split its slice across processes; machines are the unit of parallelism
    # here. The required check is the `Unit tests` gate job below.
    #
    # 10 minutes bounds a hang; it is not a target. The single most expensive
    # case is `scripts/test/lint.test.ts`'s subprocess lint, which has to lint
    # the whole repo before `--max-warnings 0` can trip — past 120 s cold on a
    # runner (run 34213836495 was cancelled at the wall on it), a few seconds
    # with the `.eslintcache` restored below.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Bun's global download cache, keyed on the lockfile. Kept out of the
      # shared bun-setup composite action on purpose: release/publish workflows
      # must keep installing from a cold, unmediated registry.
      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Unit tests need PostgreSQL + Redis because bunfig.toml preload starts
      # docker-compose unconditionally. Services start fast with tmpfs + fsync=off.
      - name: Start test infrastructure
        run: docker compose -f test/setup/docker-compose.test.yml up -d --wait

      # `check.yml` saves `.eslintcache` for this lineage; restoring it turns the
      # whole-repo lint inside `scripts/test/lint.test.ts` from a cold >120 s
      # into a few seconds. Restore only — `check.yml` owns the save.
      - name: Restore eslint cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: .eslintcache
          key: >-
            check-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs',
            '.prettierrc', 'turbo.json', 'tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: >-
            check-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs',
            '.prettierrc', 'turbo.json', 'tsconfig.base.json') }}-

      # Every `bun test` in this workflow names its per-test timeout: bunfig has no
      # such key, so without `--timeout` Bun applies its own 5 s. The runner passes
      # 15 s itself (10 s for the CLI workspace, below).
      #
      # Everything is a unit test unless it is explicitly infra-heavy. This is an
      # exclusion list, not the hand-enumerated inclusion list it replaced: that
      # list silently dropped every suite landing outside it, so `scripts/test/`,
      # `packages/afps-shared/` (the SSRF guard, signed tokens, zip-bomb bounds),
      # `packages/module-*`, `packages/shared-types/` (the RBAC policy) and
      # `test/supply-chain-barrels.test.ts` ran only in the label-gated
      # `integration` job below — i.e. never on the PR that changed them. With
      # default discovery (every test file git knows, `scripts/run-tests.ts`)
      # plus two ignores, a new suite is on the PR gate by default and only an
      # explicit opt-out takes it off.
      #
      # What is excluded, and why:
      #  - `**/test/integration/**` — apps/api/test/integration/ plus the modules'
      #    own integration dirs (oidc, mcp, webhooks). They need DB seeding and are
      #    slow, so they stay opt-in via the `integration` label or post-merge on
      #    main. The two that are release invariants keep their own mandatory
      #    steps immediately below.
      #  - `apps/cli/**` — a separate workspace with its own bunfig.toml (no Docker
      #    preload); run from that directory in the last step so it picks up the
      #    right config.
      #  - `e2e/**` — Playwright specs, which default discovery would otherwise
      #    collect (`*.spec.ts` matches it). Excluded by the root bunfig.toml; no
      #    flag here, because the runner ADDS `--path-ignore-patterns` to bunfig's
      #    list, where `bun test` alone would replace it.
      #
      # --coverage on the always-on unit job is what gives every PR a coverage
      # signal (Codecov patch coverage + the `unit` flag) without paying for the
      # heavier `integration` job below. The full project total is reconstructed
      # on Codecov by carrying the `integration` flag forward from the PR base
      # (see flags.*.carryforward in .codecov.yml).
      - name: Run unit tests
        run: |
          bun scripts/run-tests.ts --partition=${{ matrix.partition }}/3 \
            --coverage --coverage-reporter=lcov --coverage-dir=coverage \
            --path-ignore-patterns='**/test/integration/**' \
            --path-ignore-patterns='apps/cli/**'

      - name: Run public-origin regression
        if: matrix.partition == 1
        run: |
          bun test --timeout=15000 --coverage --coverage-reporter=lcov \
            --coverage-dir=coverage-public-origin \
            apps/api/src/modules/oidc/test/integration/routes/oauth-public-origin.test.ts

      # The full integration suite is opt-in on PRs, but readiness is a release
      # invariant: a booted platform must not silently ship as degraded. Keep
      # this public-endpoint regression mandatory and fast on every PR.
      - name: Run health readiness regression
        if: matrix.partition == 1
        run: bun test --timeout=15000 apps/api/test/integration/middleware/boot-gate.test.ts

      # Surface the figure in the job summary so humans see it without opening
      # Codecov. Sums LF/LH across the lcov report; informational only (the gate
      # is Codecov). Flagged as partial because it omits the integration suite.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "%.2f", (lh/lf)*100; else printf "0.00" }' coverage/lcov.info)
            files=$(grep -c '^SF:' coverage/lcov.info || echo 0)
            {
              echo "## Coverage (unit slice ${{ matrix.partition }}/3)"
              echo ""
              echo "Line coverage: **${pct}%** across ${files} instrumented files."
              echo ""
              echo "_Partial — this unit slice only. Full project coverage (unit + integration) is reconciled on Codecov; the project gate runs there._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fork-PR note: external contributors' PRs run with no access to repo
      # secrets, so `secrets.CODECOV_TOKEN` is empty. codecov-action v6 then
      # attempts a tokenless upload (supported for public repos); if that fails,
      # `fail_ci_if_error: false` keeps this step — and the CI job — green. The
      # Codecov `project` status is `informational: true` (.codecov.yml), so it
      # never blocks a fork PR that could not upload. Same-repo PRs use the
      # token and upload normally.
      - name: Upload unit coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload public-origin coverage to Codecov
        if: always() && matrix.partition == 1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-public-origin/lcov.info
          flags: public-origin
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # CLI tests live in a separate workspace with its own bunfig.toml
      # (no Docker preload needed), so we run them from that directory to
      # pick up the right config and keep them fast.
      #
      # `--coverage` is not decoration. Until the integration job below was
      # scoped to the integration suite, it ran `bun test` UNFILTERED — the
      # whole repo, `apps/cli` included — so CLI coverage reached Codecov only
      # as a side effect of that duplicated run. Scoping that job without
      # emitting coverage here would have dropped `apps/cli` out of the project
      # total silently, and the first PR to touch the CLI would have read it as
      # a coverage regression it did not cause.
      - name: Run CLI unit tests
        if: matrix.partition == 1
        working-directory: apps/cli
        run: bun test --timeout=10000 --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload CLI coverage to Codecov
        if: always() && matrix.partition == 1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/cli/coverage/lcov.info
          flags: cli
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The required status check. A matrix job reports one check per slice, named
  # after the slice, so the check the branch ruleset requires is this one: it
  # passes only when every slice did.
  unit-gate:
    name: Unit tests
    if: always()
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every unit slice passed
        run: test "${{ needs.unit.result }}" = success

  integration:
    name: Integration tests
    # Run on every push to main (post-merge gate) + on PRs labeled
    # `integration` (opt-in pre-merge). Without the main-branch arm,
    # code could land on main via a never-labeled PR and reach production
    # without the integration suite ever having been exercised in CI —
    # the e2e job below is label-OR-main for the same reason, keeping
    # both jobs aligned on post-merge validation.
    if: contains(github.event.pull_request.labels.*.name, 'integration') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 20, matching the two other heavy jobs — and this time the number is not
    # the thing doing the work. The `run` step below is.
    #
    # This job used to invoke `bun test` with NO path filter, i.e. the entire
    # repository: 883 files, of which the `unit` job above had already run 547
    # three minutes earlier, on the same tier, against the same Docker infra.
    # Two thirds of it was a second execution of work that had already passed.
    #
    # That is what actually consumed the ceiling. Measured across four runs of
    # this branch, unchanged suite: 821s, 915s, 1015s, then 1163s — a ~40%
    # spread on runner variance alone. The last one finished its tests at
    # 1162.86s with 12080 pass / 0 fail and was killed at 1213s with the
    # coverage upload still to go. A green suite reported as a red gate,
    # because the job had no room left for its own last step.
    #
    # Raising it again would have bought one more run. The comment that used to
    # sit here said "when this approaches 20, split the suite — do not raise it
    # again", so: the step now runs only `test/integration`, and the ceiling
    # stays where it is.
    #
    # This job remains the ONLY pre-merge exercise of the integration suite, so
    # a cancellation still reads as a red gate for a suite that never ran —
    # which is exactly why the fix had to be the workload and not the budget.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Bun's global download cache, keyed on the lockfile. Kept out of the
      # shared bun-setup composite action on purpose: release/publish workflows
      # must keep installing from a cold, unmediated registry.
      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Start test infrastructure
        run: docker compose -f test/setup/docker-compose.test.yml up -d --wait

      # Only the integration suite. The `unit` job already ran everything else
      # at this same tier, so running it again here proved nothing and cost two
      # thirds of the budget (see `timeout-minutes` above).
      #
      # The positional is a path SUBSTRING filter, not a glob. With the trailing
      # slash it selects exactly the files under a `test/integration/` directory
      # — the set the `unit` job ignores (`**/test/integration/**`) — wherever
      # that directory is, so a module that grows its first integration
      # directory is covered without editing this line. Without the slash it
      # also matched the ~30 `test/integration-*.test.ts` files the `unit` job
      # already runs, and ran them twice.
      - name: Run integration tests with coverage
        run: bun test --timeout=15000 test/integration/ --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Bun's lcov reporter writes coverage/lcov.info (the previous
          # report.lcov path never existed, so this upload was silently a no-op
          # under fail_ci_if_error: false).
          files: coverage/lcov.info
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  platform-container-e2e:
    name: Platform container health e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Build the production Dockerfile, boot the production compose topology,
      # and verify both sides of the public readiness contract. This stays
      # mandatory on every PR: the fast route regression above cannot prove
      # that Compose still inherits the image's semantic HEALTHCHECK.
      - name: Run platform container health e2e
        run: bash scripts/health-container-e2e.sh

  ee-container-e2e:
    name: EE container health e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Bun's global download cache, keyed on the lockfile. Kept out of the
      # shared bun-setup composite action on purpose: release/publish workflows
      # must keep installing from a cold, unmediated registry.
      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      # The sibling job above needs no install; this one does. Its EE mode reads
      # the default MODULES set off the env schema rather than restating it, and
      # `packages/env` imports zod.
      - name: Install dependencies
        run: bun install

      # Same image, same compose topology, booted with @appstrate/module-ee on
      # top of the schema's default MODULES — so the single image is proven to
      # boot in ee mode. This is what the cloud repo's release-time `verify`
      # job used to check, against a second image built FROM this one.
      # Mandatory on every PR like its sibling: the module ships inside the
      # image, so a change here can break the paying deployment with nothing
      # else in CI booting it.
      - name: Run EE container health e2e
        run: bash scripts/health-container-e2e.sh
        env:
          HEALTH_E2E_EE: "1"

  runtime-e2e:
    name: Runtime container e2e
    # The only pre-merge job that runs the REAL runtime images, and it gates three
    # regressions that live exclusively there:
    #
    #   1. The runtime-pi file-provisioning spin only reproduces in the BUNDLED
    #      image (#882), so `provision-container.e2e.test.ts` needs a real
    #      `appstrate-pi` built — which the fast `unit` job does not do (it would
    #      blow the 5-min budget), so that test SKIPS there.
    #   2. One inference turn driven through the built pi + sidecar PAIR against
    #      a stub upstream (`inference-container.e2e.test.ts`), asserting the
    #      Codex request shape and the zstd body's byte integrity (#1197). That
    #      is the #1195 class: a MISMATCHED IMAGE PAIR, where each half is
    #      correct on its own and only their combination fails — invisible to
    #      every in-process test, because those wire the two halves together
    #      from one source tree, the configuration that never breaks.
    #   3. Run-scoped secrets out of reach of the agent uid
    #      (`runtime-secrets-container.e2e.test.ts`): the launcher/entrypoint
    #      split and `/proc` access of the built image, invisible in-process.
    #
    # Hence both images are built here, from the same checkout: a pair is only
    # comparable when both halves come from the code under test. Same
    # label-OR-main policy as the other heavy jobs (opt-in pre-merge via the
    # `e2e` label, always post-merge on main).
    if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Bun's global download cache, keyed on the lockfile. Kept out of the
      # shared bun-setup composite action on purpose: release/publish workflows
      # must keep installing from a cold, unmediated registry.
      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Build the agent runtime image the e2e launches, on the runner's native
      # platform — the test gates on the image matching the engine's platform
      # (#882). Tag `appstrate-pi:latest` — the test's default `PI_IMAGE`.
      - name: Build appstrate-pi image
        run: docker build -t appstrate-pi:latest -f runtime-pi/Dockerfile .

      # The pair's other half. Same tag family, and `appstrate-sidecar:latest` is
      # the inference e2e's default `SIDECAR_IMAGE`; without it that suite gates
      # nothing, it skips.
      - name: Build appstrate-sidecar image
        run: docker build -t appstrate-sidecar:latest -f runtime-pi/sidecar/Dockerfile .

      # The root bunfig preload boots the test docker-compose stack
      # unconditionally; start it so the preload is satisfied (the e2e itself
      # uses only its own in-process mock sink, not the DB).
      - name: Start test infrastructure
        run: docker compose -f test/setup/docker-compose.test.yml up -d --wait

      - name: Run runtime container e2e suites
        run: bun test runtime-pi/test/provision-container.e2e.test.ts runtime-pi/test/inference-container.e2e.test.ts runtime-pi/test/runtime-secrets-container.e2e.test.ts

  e2e:
    name: E2E tests
    if: contains(github.event.pull_request.labels.*.name, 'e2e') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # Bun's global download cache, keyed on the lockfile. Kept out of the
      # shared bun-setup composite action on purpose: release/publish workflows
      # must keep installing from a cold, unmediated registry.
      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.4.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: cd apps/web && bun run build

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Prepare data directory for PGlite
        run: mkdir -p data/pglite data/storage

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          BETTER_AUTH_SECRET: e2e-ci-secret-that-is-at-least-32-characters
          CONNECTION_ENCRYPTION_KEY: Y2FzgQmlgIRocYT1VUWM+73fQ5zOTPB8sHJxTh1x4qI=
          UPLOAD_SIGNING_SECRET: e2e-ci-upload-signing-secret
          RUN_TOKEN_SECRET: e2e-ci-run-token-secret
          CONNECT_SESSION_SECRET: e2e-ci-connect-session-secret
          # E2E suite needs the full default module set:
          #  - webhooks: cascade deletion, cross-app/org isolation, UI org switching
          #    (opt-in since PR #72; without it webhook routes 404 and 12 specs fail)
          #  - core-providers: registers the anthropic/openai/openai-compatible
          #    api-key model providers. SYSTEM_PROVIDER_KEYS rows are only
          #    accepted at run time if their api shape resolves against the
          #    registry, so without this module upload-flow.api 400s on every
          #    POST /agents/:scope/:name/run.
          #  - @appstrate/module-codex: registers `codex` so the pairing-lifecycle
          #    e2e (`providerId: "codex"`) passes `isOAuthModelProvider()` and
          #    mint returns 200 instead of 400.
          #  - @appstrate/module-claude-code: registers `claude-code` so the
          #    parallel pairing-lifecycle e2e (`providerId: "claude-code"`)
          #    passes the same checks for the Anthropic OAuth surface.
          #  - @appstrate/module-chat: the chat surface (`tests/chat/*.ui.spec.ts`);
          #    without it `/api/chat/*` does not exist and the shell grants no
          #    `chat:*`, so the composer's controls never render.
          # oidc is kept in lockstep with .env.example / packages/env defaults so
          # the suite stays representative of a default self-host install.
          MODULES: oidc,webhooks,mcp,core-providers,@appstrate/module-chat,@appstrate/module-codex,@appstrate/module-claude-code
          # Default system model so run-acceptance passes in specs that POST
          # /agents/:id/run (e.g. upload-flow). The run pipeline only needs a
          # resolvable model at acceptance time — the dummy apiKey is never
          # called because RUN_ADAPTER=process doesn't actually hit the LLM.
          SYSTEM_PROVIDER_KEYS: '[{"id":"e2e","label":"E2E","providerId":"anthropic","apiKey":"e2e-dummy","models":[{"modelId":"claude-sonnet-4-5","label":"E2E Default","isDefault":true}]}]'

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
