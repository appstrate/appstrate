name: Publish @appstrate/afps-shared to npm

# RELEASE ORDER: @appstrate/afps-shared is a leaf dependency of @appstrate/core
# via a `^` range. Publish a new afps-shared version to npm BEFORE tagging any
# core release that bumps its `^` dependency, or `npm install @appstrate/core`
# will fail to resolve the range.

on:
  push:
    tags:
      - "afps-shared@*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing afps-shared tag to publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write

# Serialize ALL afps-shared publishes — npm `latest` dist-tag race on
# rapid-fire tag pushes (same rationale as publish-core.yml).
concurrency:
  group: publish-afps-shared
  cancel-in-progress: false

jobs:
  publish:
    name: Quality, Tests & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/afps-shared

    steps:
      - name: Select the immutable package tag
        id: select
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == afps-shared@* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.select.outputs.tag }}

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Trusted publishing uses GitHub OIDC and requires npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: TypeScript type-check
        run: bun run typecheck

      # The package's `test` script carries the per-test timeout the PR gate
      # applies (`scripts/run-tests.ts`); bare `bun test` would run with Bun's 5 s.
      - name: Tests
        run: bun run test

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#afps-shared@}"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Last gate before the artifact becomes immutable on npm. The `tsc --noEmit`
      # step above runs inside the workspace, where root devDependencies hoist type
      # packages into the shared node_modules — it cannot see a dependency we forgot
      # to declare (this is exactly how `@types/semver` sat in devDependencies while
      # the published package needed it). This packs the tarball and typechecks
      # every exported subpath in a clean npm project outside the monorepo
      # (~2 s, installs from npm).
      - name: Verify the published artifact resolves for consumers
        working-directory: .
        run: bun scripts/verify-package-resolves.ts packages/afps-shared

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.select.outputs.tag }}
          generate_release_notes: true
          # Never GitHub's "latest". `appstrate self-update`, `bootstrap.sh`
          # and `bootstrap-runner.sh` no longer read it: they resolve "latest"
          # from the signed channel manifest (get.appstrate.dev/channels/latest.json).
          # The flag still matters, so do NOT drop it: GitHub's "latest" is what
          # the Releases UI shows humans and what every `releases/latest/download`
          # redirect follows — e.g. the firecracker guest-artifact resolver when
          # `FIRECRACKER_ARTIFACTS_VERSION` is unset
          # (`apps/api/src/modules/firecracker/runner/artifacts.ts`), which an npm
          # release there would 404.
          make_latest: false
