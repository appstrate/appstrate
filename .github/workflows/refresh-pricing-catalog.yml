name: Refresh pricing catalog

on:
  schedule:
    # Weekly — Mondays 06:00 UTC. Far enough from typical release activity
    # that a drift PR doesn't collide with on-call deploys.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export-litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and export latest stable LiteLLM catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$(jq -r '.image' scripts/litellm-catalog.lock.json)"
          catalog_repository="$(jq -r '.catalog.repository' scripts/litellm-catalog.lock.json)"
          catalog_path="$(jq -r '.catalog.path' scripts/litellm-catalog.lock.json)"
          version="$(gh api "repos/${catalog_repository}/releases/latest" --jq '.tag_name')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest LiteLLM release is not a stable SemVer tag: $version" >&2
            exit 1
          fi

          digest="sha256:$(docker buildx imagetools inspect --raw "${repository}:${version}" | sha256sum | cut -d ' ' -f 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid OCI digest resolved for ${repository}:${version}: $digest" >&2
            exit 1
          fi

          image="${repository}@${digest}"
          output_dir="${RUNNER_TEMP}/litellm-source"
          output="${output_dir}/litellm-catalog.json"
          catalog_input="${output_dir}/litellm-model-catalog.json"
          mkdir -p "$output_dir"

          # Model metadata changes between package releases. Resolve LiteLLM's
          # own catalog to an exact commit so newly added models are not hidden
          # by the stable image's bundled fallback.
          catalog_commit="$(gh api "repos/${catalog_repository}/commits/main" --jq '.sha')"
          if [[ ! "$catalog_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid LiteLLM catalog commit: $catalog_commit" >&2
            exit 1
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --output "$catalog_input" \
            "https://raw.githubusercontent.com/${catalog_repository}/${catalog_commit}/${catalog_path}"
          jq --exit-status 'type == "object" and length > 0' "$catalog_input" >/dev/null
          catalog_digest="sha256:$(sha256sum "$catalog_input" | cut -d ' ' -f 1)"

          # LiteLLM does not currently publish a Cosign signature for this OCI
          # index. Resolve the official latest stable release to immutable bytes,
          # execute only that digest, and persist both upstream inputs for review.
          jq \
            --arg version "$version" \
            --arg digest "$digest" \
            --arg catalog_commit "$catalog_commit" \
            --arg catalog_digest "$catalog_digest" \
            '.version = $version
              | .digest = $digest
              | .catalog.commit = $catalog_commit
              | .catalog.digest = $catalog_digest' \
            scripts/litellm-catalog.lock.json \
            > "${output_dir}/litellm-catalog.lock.json"

          # The exporter gets no network, no capabilities and no writable root.
          # Its sole output is a JSON artifact consumed by the separate write job.
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE/scripts/export-litellm-catalog.py:/exporter.py:ro" \
            --volume "$catalog_input:/catalog.json:ro" \
            "$image" /exporter.py /catalog.json > "$output"

          jq --exit-status '
            ["supported", "unsupported", "unknown"] as $support |
            ["openai", "anthropic", "mistral", "gemini", "cerebras", "groq",
              "xai", "deepseek", "moonshot", "together_ai", "fireworks_ai", "zai"] as $providers |
            type == "object" and length > 0 and
            any(to_entries[];
              .value as $entry |
              $entry.mode == "chat" and ($providers | index($entry.litellm_provider)) != null
            ) and
            all(to_entries[];
              .value as $entry |
              if ($entry.mode == "chat" and ($providers | index($entry.litellm_provider)) != null)
              then $entry._appstrate_generation as $generation |
                ($generation | type) == "object" and
                ($support | index($generation.temperature)) != null and
                ($support | index($generation.temperatureWithReasoning)) != null and
                ($support | index($generation.reasoning.supported)) != null and
                (($generation.reasoning.adaptive == null) or
                  (($generation.reasoning.adaptive | type) == "boolean")) and
                (($generation.reasoning.levels | keys) ==
                  ["high", "low", "max", "medium", "minimal", "none", "xhigh"]) and
                all($generation.reasoning.levels[]; ($support | index(.)) != null)
              else true
              end
            )
          ' "$output" >/dev/null

          echo "Exported LiteLLM ${version} (${digest}) catalog ${catalog_commit} (${catalog_digest})"

      - name: Upload normalized LiteLLM source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: litellm-catalog
          path: ${{ runner.temp }}/litellm-source/
          if-no-files-found: error
          retention-days: 1

  refresh:
    needs: export-litellm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    # `bun install` below runs the root `prepare` script (`husky`), which points
    # git's `core.hooksPath` at `.husky/`. The `pre-push` hook there runs
    # `bun run check`, so when `create-pull-request` pushes the drift branch the
    # whole quality gate fires inside this runner and the push dies on
    # `Failed: //#detect:breaking` → `failed to push some refs`. That silently
    # broke the weekly pricing refresh for a month. `HUSKY=0` is husky v9's
    # documented opt-out: the hooks are never installed, so commit/push in this
    # job are plain git operations. Nothing is lost — the Check workflow runs
    # the same gate on the PR this job opens.
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Download normalized LiteLLM source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: litellm-catalog
          path: ${{ runner.temp }}/litellm-source

      - name: Refresh catalog (apply)
        env:
          LITELLM_CATALOG_PATH: ${{ runner.temp }}/litellm-source/litellm-catalog.json
          # Per-provider cache-rate coverage + delta, for the PR body assembled
          # below. Written to the runner temp dir, NEVER the worktree — see the
          # body-path rationale in the drift step.
          PRICING_COVERAGE_SUMMARY_PATH: ${{ runner.temp }}/pricing-coverage.md
        run: |
          cp \
            "${RUNNER_TEMP}/litellm-source/litellm-catalog.lock.json" \
            scripts/litellm-catalog.lock.json
          bun scripts/refresh-pricing-catalog.ts --apply

      # rationale: see .github/actions/bun-setup/action.yml
      - name: Install dependencies
        run: bun install

      - name: Format generated files
        # The generator writes JSON that does not match Prettier style;
        # without this the drift PR breaks the Check workflow's format:check.
        run: bunx prettier --write "apps/api/src/data/**"

      # Both generated trees count as drift. `subscription-watch/` used to be
      # outside this condition, so a week where ONLY the ChatGPT model set moved
      # opened no PR and the regenerated snapshot was discarded on runner
      # teardown — the "review the curated Codex list when chatgpt.json drifts"
      # signal that `scripts/refresh-pricing-catalog.ts` and the codex provider
      # both point at could never actually fire.
      - name: Check for drift
        id: drift
        run: |
          git diff --quiet scripts/litellm-catalog.lock.json && source_lock=false || source_lock=true
          git diff --quiet apps/api/src/data/pricing && pricing=false || pricing=true
          git diff --quiet apps/api/src/data/subscription-watch && watch=false || watch=true

          if [ "$source_lock" = false ] && [ "$pricing" = false ] && [ "$watch" = false ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — nothing to commit."
            exit 0
          fi

          echo "drift=true" >> "$GITHUB_OUTPUT"
          git diff --stat scripts/litellm-catalog.lock.json apps/api/src/data

          # The PR body is assembled here rather than inlined on the PR step so
          # it can name WHICH tree moved. Written to the runner temp dir, never
          # the worktree: create-pull-request commits every change it finds, and
          # a body file inside the repo would land in the PR it describes.
          body="${RUNNER_TEMP}/pr-body.md"
          {
          cat <<'EOF'
          Automated weekly refresh from LiteLLM's latest model catalog plus its
          latest stable GitHub release. The exact catalog commit, file digest,
          release tag and immutable OCI image digest are recorded in
          `scripts/litellm-catalog.lock.json`; the isolated exporter asks LiteLLM
          to normalize request-parameter support, reasoning-effort values and
          temperature/reasoning combinations for each model.

          Two generated trees, two different consequences:
          - `apps/api/src/data/pricing/*.json` — prices + model metadata, read at
            module-load time by `apps/api/src/services/pricing-catalog.ts`. Merging
            redeploys with the new prices on the next release.
          - `apps/api/src/data/subscription-watch/*.json` — id snapshots of
            subscription backends. Nothing imports them at runtime; they exist as
            the review signal for the hand-curated subscription lists, and the
            blocking gate `apps/api/test/unit/services/curated-model-drift.test.ts`
            reads them at test time. If this PR's checks are red on that test, the
            snapshot gained an id nobody has ruled on — that is the gate working,
            not a flake.

          Reviewer checklist:
          - Confirm the LiteLLM catalog commit, release and digest changes in
            `scripts/litellm-catalog.lock.json` are expected.
          EOF

          if [ "$pricing" = true ]; then
          cat <<'EOF'
          - Spot-check 1-2 model price changes against
            https://openai.com/api/pricing / https://www.anthropic.com/pricing.
          - Confirm no models we rely on were removed (search `model:`
            in `apps/api/src/services/llm-proxy/` if unsure).
          - Read the cache-rate coverage table below. `cacheRead` coverage is
            inherited from LiteLLM, so it drifts on its own, and a model with no
            `cacheRead` prices its cached input tokens at zero.
          EOF

          # Inlined verbatim so the coverage change is reviewed rather than merged
          # blind. Written by the refresh step to $RUNNER_TEMP (outside the
          # worktree, same reason as the body itself).
          coverage="${RUNNER_TEMP}/pricing-coverage.md"
          if [ -f "$coverage" ]; then
            printf '\n'
            cat "$coverage"
          else
            printf '\n_Coverage summary missing — the refresh step did not write %s._\n' "$coverage"
          fi
          fi

          if [ "$watch" = true ]; then
          cat <<'EOF'
          - **The subscription watch snapshot MOVED** — the model set OpenAI serves
            to ChatGPT sign-in changed. Review the curated Codex list in
            `packages/module-codex/src/index.ts` (`featuredModels` +
            `modelDiscoveryCandidates`) against the authoritative doc,
            https://learn.chatgpt.com/docs/models. For each new id: curate it if the
            subscription serves it, otherwise record it as reviewed-and-excluded in
            `apps/api/src/data/subscription-watch/reviewed.json`. This list is
            documentation-defined, so no probe and no catalog derivation can correct
            it — a human reading that page is the only mechanism.
          EOF
          fi
          } > "$body"

          echo "body-path=$body" >> "$GITHUB_OUTPUT"
          cat "$body"

      - name: Open PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-pricing-catalog
          delete-branch: true
          base: main
          commit-message: |
            chore(pricing): refresh LiteLLM pricing catalog

            Weekly refresh of `scripts/litellm-catalog.lock.json`,
            `apps/api/src/data/pricing/*.json` and
            `apps/api/src/data/subscription-watch/*.json` from
            BerriAI/litellm (MIT).
          title: "chore(pricing): refresh LiteLLM pricing catalog"
          # Assembled by the drift step — it knows which tree moved.
          body-path: ${{ steps.drift.outputs.body-path }}
          labels: |
            pricing
            automated
