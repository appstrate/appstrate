name: Refresh pricing catalog

on:
  schedule:
    # Weekly — Mondays 06:00 UTC. Far enough from typical release activity
    # that a drift PR doesn't collide with on-call deploys.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `bun install` below runs the root `prepare` script (`husky`), which points
    # git's `core.hooksPath` at `.husky/`. The `pre-push` hook there runs
    # `bun run check`, so when `create-pull-request` pushes the drift branch the
    # whole quality gate fires inside this runner and the push dies on
    # `Failed: //#detect:breaking` → `failed to push some refs`. That silently
    # broke the weekly pricing refresh for a month. `HUSKY=0` is husky v9's
    # documented opt-out: the hooks are never installed, so commit/push in this
    # job are plain git operations. Nothing is lost — the Check workflow runs
    # the same gate on the PR this job opens.
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Refresh catalog (apply)
        run: bun scripts/refresh-pricing-catalog.ts --apply

      # rationale: see .github/actions/bun-setup/action.yml
      - name: Install dependencies
        run: bun install

      - name: Format generated files
        # The generator writes JSON that does not match Prettier style;
        # without this the drift PR breaks the Check workflow's format:check.
        run: bunx prettier --write "apps/api/src/data/**"

      # Both generated trees count as drift. `subscription-watch/` used to be
      # outside this condition, so a week where ONLY the ChatGPT model set moved
      # opened no PR and the regenerated snapshot was discarded on runner
      # teardown — the "review the curated Codex list when chatgpt.json drifts"
      # signal that `scripts/refresh-pricing-catalog.ts` and the codex provider
      # both point at could never actually fire.
      - name: Check for drift
        id: drift
        run: |
          git diff --quiet apps/api/src/data/pricing && pricing=false || pricing=true
          git diff --quiet apps/api/src/data/subscription-watch && watch=false || watch=true

          if [ "$pricing" = false ] && [ "$watch" = false ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes — nothing to commit."
            exit 0
          fi

          echo "drift=true" >> "$GITHUB_OUTPUT"
          git diff --stat apps/api/src/data

          # The PR body is assembled here rather than inlined on the PR step so
          # it can name WHICH tree moved. Written to the runner temp dir, never
          # the worktree: create-pull-request commits every change it finds, and
          # a body file inside the repo would land in the PR it describes.
          body="${RUNNER_TEMP}/pr-body.md"
          {
          cat <<'EOF'
          Automated weekly refresh of the vendored LiteLLM catalog. Upstream source:
          https://github.com/BerriAI/litellm/blob/main/litellm/model_prices_and_context_window_backup.json

          Two generated trees, two different consequences:
          - `apps/api/src/data/pricing/*.json` — prices + model metadata, read at
            module-load time by `apps/api/src/services/pricing-catalog.ts`. Merging
            redeploys with the new prices on the next release.
          - `apps/api/src/data/subscription-watch/*.json` — id snapshots of
            subscription backends. Nothing imports them at runtime; they exist
            solely as the review signal for the hand-curated subscription lists.

          Reviewer checklist:
          EOF

          if [ "$pricing" = true ]; then
          cat <<'EOF'
          - Spot-check 1-2 model price changes against
            https://openai.com/api/pricing / https://www.anthropic.com/pricing.
          - Confirm no models we rely on were removed (search `model:`
            in `apps/api/src/services/llm-proxy/` if unsure).
          EOF
          fi

          if [ "$watch" = true ]; then
          cat <<'EOF'
          - **The subscription watch snapshot MOVED** — the model set OpenAI serves
            to ChatGPT sign-in changed. Review the curated Codex list in
            `packages/module-codex/src/index.ts` (`featuredModels` +
            `modelDiscoveryCandidates`) against the authoritative doc,
            https://learn.chatgpt.com/docs/models. For each new id: curate it if the
            subscription serves it, otherwise record it as reviewed-and-excluded in
            `apps/api/src/data/subscription-watch/reviewed.json`. This list is
            documentation-defined, so no probe and no catalog derivation can correct
            it — a human reading that page is the only mechanism.
          EOF
          fi
          } > "$body"

          echo "body-path=$body" >> "$GITHUB_OUTPUT"
          cat "$body"

      - name: Open PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-pricing-catalog
          delete-branch: true
          base: main
          commit-message: |
            chore(pricing): refresh LiteLLM pricing catalog

            Weekly refresh of `apps/api/src/data/pricing/*.json` and
            `apps/api/src/data/subscription-watch/*.json` from
            BerriAI/litellm (MIT).
          title: "chore(pricing): refresh LiteLLM pricing catalog"
          # Assembled by the drift step — it knows which tree moved.
          body-path: ${{ steps.drift.outputs.body-path }}
          labels: |
            pricing
            automated
