# Kept on purpose despite `renovate.json` being present: the Renovate GitHub App
# is configured but NOT installed (zero renovate/* branches, zero Renovate PRs,
# no "Dependency Dashboard" issue). Dependabot is the bot actually opening PRs.
# Do not delete this file until Renovate is installed and has opened a PR.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The `typescript` devDependency is NOT the compiler — it is the TypeScript
      # 6 JavaScript compiler API, consumed by typescript-eslint, type-coverage
      # and scripts/generate-api-types.ts. The compiler actually used by every
      # `tsc` invocation is `@typescript/native` (TypeScript 7), installed
      # side-by-side per Microsoft's guidance.
      #
      # TypeScript 7 ships no JavaScript API (its `lib/` is only version.cjs +
      # tsc.js), so bumping this slot to >=7 does not upgrade anything — it
      # breaks the lint and type-coverage steps of `bun run check`:
      #   - typescript-eslint 8.x refuses TS 7.0 outright
      #     (https://github.com/typescript-eslint/typescript-eslint/issues/10940)
      #   - type-coverage crashes on `ts.SyntaxKind` being undefined
      #
      # Revisit once typescript-eslint supports TS >=7.1. Bumping the compiler
      # itself means bumping `@typescript/native`, which is not ignored here.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      production-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
