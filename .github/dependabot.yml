# Kept on purpose despite `renovate.json` being present: the Renovate GitHub App
# is configured but NOT installed (zero renovate/* branches, zero Renovate PRs,
# no "Dependency Dashboard" issue). Dependabot is the bot actually opening PRs.
# Do not delete this file until Renovate is installed and has opened a PR.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The 1.x and 2.x releases of the AFPS packages on npm are stale
      # publications from before the version line was reset to 0.x (npm
      # `latest` is 0.x). Without this rule Dependabot ranks them as the newest
      # versions, proposes downgrades disguised as majors (#2135), and never
      # offers the real 0.x updates.
      - dependency-name: "@afps-spec/*"
        versions: [">=1.0.0"]
    groups:
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      production-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init / autobuild / analyze / upload-sarif must run the same version:
      # init writes a config the later steps refuse if their version differs.
      codeql:
        patterns:
          - "github/codeql-action*"
