# Kept on purpose despite `renovate.json` being present: the Renovate GitHub App
# is configured but NOT installed (zero renovate/* branches, zero Renovate PRs,
# no "Dependency Dashboard" issue). Dependabot is the bot actually opening PRs.
# Do not delete this file until Renovate is installed and has opened a PR.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The 1.x and 2.x releases of the AFPS packages on npm are stale
      # publications from before the version line was reset to 0.x (npm
      # `latest` is 0.x). Without this rule Dependabot ranks them as the newest
      # versions, proposes downgrades disguised as majors (#2135), and never
      # offers the real 0.x updates.
      - dependency-name: "@afps-spec/*"
        versions: [">=1.0.0"]
      # typescript-eslint 8.72.x runs `bun run lint` out of heap (8 GB; 8.71.x
      # peaks at ~6.3 GB on the same tree). Drop this entry once a later minor
      # lints main under the limit.
      - dependency-name: "typescript-eslint"
        versions: ["8.72.x"]
      - dependency-name: "@typescript-eslint/*"
        versions: ["8.72.x"]
    groups:
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      production-dependencies:
        update-types:
          - "minor"
          - "patch"
        # Any stripe release can move the pinned API version
        # (`STRIPE_API_VERSION`, packages/module-ee/src/stripe/client.ts). That
        # bump needs the production webhook endpoint recreated at the new
        # version, so it gets a PR of its own instead of failing the group.
        exclude-patterns:
          - "stripe"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init / autobuild / analyze / upload-sarif must run the same version:
      # init writes a config the later steps refuse if their version differs.
      codeql:
        patterns:
          - "github/codeql-action*"
