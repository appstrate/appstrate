name: Setup Bun
description: >
  Install the Bun toolchain the root package.json pins in `packageManager` —
  the single source of truth for the Bun version (Docker images and the
  devcontainer are held to it by scripts/test/bun-version-pins.test.ts).

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
